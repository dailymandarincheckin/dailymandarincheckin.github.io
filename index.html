<!DOCTYPE html>
<html lang="zh" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蔡老师 · 中文每日打卡</title>
<!-- 打开网站首页时，自动跳到注册页 -->
<meta http-equiv="refresh" content="0; url=register.html">
<style>
:root{
  --paper:#f7f0e4; --card:#fdf9f0; --card-hi:#fffdf8;
  --ink:#4a3c2c; --ink2:#7d6a55; --ink3:#a89680;
  --line-soft:#eee4d4; --clay:#a8683f; --sand:#efe0c4;
  --grain:rgba(168,150,128,.035); --wash:rgba(255,253,246,.7);
  --edge:rgba(255,255,255,.72);
  --shadow:0 1px 1px rgba(74,60,44,.028), 0 6px 16px -12px rgba(74,60,44,.24);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#211b15; --card:#2c251d; --card-hi:#332b22;
    --ink:#eee4d3; --ink2:#c1b09a; --ink3:#8f8172;
    --line-soft:#372e24; --clay:#d69465; --sand:#55462d;
    --grain:rgba(255,240,220,.022); --wash:rgba(255,232,200,.04);
    --edge:rgba(255,240,220,.055);
    --shadow:0 1px 2px rgba(0,0,0,.2);
  }
}
:root[data-theme="dark"]{
  --paper:#211b15; --card:#2c251d; --card-hi:#332b22;
  --ink:#eee4d3; --ink2:#c1b09a; --ink3:#8f8172;
  --line-soft:#372e24; --clay:#d69465; --sand:#55462d;
  --grain:rgba(255,240,220,.022); --wash:rgba(255,232,200,.04);
  --edge:rgba(255,240,220,.055);
  --shadow:0 1px 2px rgba(0,0,0,.2);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Yuanti SC","STYuanti","Hiragino Sans GB","PingFang SC",
              "Microsoft YaHei",system-ui,-apple-system,sans-serif;
  color:var(--ink);background:var(--paper);
  background-image:
    radial-gradient(120% 70% at 50% -12%, var(--wash), transparent 62%),
    radial-gradient(var(--grain) .6px, transparent .9px);
  background-size:100% 720px, 5px 5px;
  background-repeat:no-repeat, repeat;
  display:flex;min-height:100vh;align-items:center;justify-content:center;
  text-align:center;padding:24px;line-height:1.9;letter-spacing:.3px;
  -webkit-font-smoothing:antialiased;
}
.card{
  background:linear-gradient(180deg,var(--card-hi),var(--card));
  border-radius:18px;padding:38px 30px;max-width:360px;
  box-shadow:inset 0 0 0 1px var(--line-soft),inset 0 1px 0 var(--edge),var(--shadow);
}
.art{width:92px;margin:0 auto 18px;color:var(--ink3);opacity:.75;position:relative;padding:8px}
.art::before{
  content:"";position:absolute;inset:-16px -10px -8px;
  background:radial-gradient(58% 54% at 50% 48%, var(--sand), transparent 72%);
  opacity:.55;border-radius:50%;
}
.art svg{width:100%;height:auto;display:block;position:relative}
h1{font-size:16px;font-weight:600;letter-spacing:1.2px;line-height:1.7}
.eng{display:block;font-size:.85em;color:var(--ink3);font-weight:400;line-height:1.5;margin-top:3px}
p{font-size:13px;color:var(--ink2);margin-top:12px;line-height:1.85}
a{color:var(--clay);text-decoration:none;border-bottom:1px solid var(--clay);padding-bottom:1px}
</style>
</head>
<body>
  <div class="card">
    <div class="art">
      <!-- 手绘：一架纸飞机，正飞过去 -->
      <svg viewBox="0 0 96 72" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 34 L84 12 L58 62 L46 44 Z"></path>
        <path d="M84 12 L46 44"></path>
        <path d="M14 52 Q22 48 28 52" stroke-dasharray="3 5"></path>
        <path d="M8 62 Q18 57 26 61" stroke-dasharray="3 5"></path>
      </svg>
    </div>
    <h1>正在带你去注册页…<span class="eng">Taking you to the sign-up page…</span></h1>
    <p>如果没有自动跳转，<a href="register.html">点这里</a><span class="eng">If nothing happens, tap the link above.</span></p>
  </div>
</body>
</html>
