<!DOCTYPE html>
<html lang="zh" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蔡老师 · 老师后台</title>
<style>
/* ============================================================
   老师后台 · 视觉「甲 · 暖纸手绘」（2026-08-03 改版）
   ------------------------------------------------------------
   · 只换外观，不动布局：分页、左右栏、表格结构全部保持原样
   · 旧的变量名（--cream/--persimmon/--cyan/--bamboo/--glaze…）
     全部保留，只是指向新配色 —— JS 里几百处内联 var(--sub) 之类
     不用改一个字就跟着变了
   · 去掉粗黑边和硬投影，改成细描边 + 极轻阴影
   · 不引 Google Fonts（外链字体慢且可能被挡），中文用系统圆体
   ============================================================ */
:root{
  /* ---- 新配色（跟学生端同一套） ---- */
  --paper:#f7f0e4; --card-hi:#fffdf8;
  --ink2:#7d6a55; --ink3:#a89680;
  --line-soft:#eee4d4;
  --clay:#a8683f; --clay-hi:#b87b50; --clay-lo:#9a5c35;
  --clay-soft:#e8d3c2; --ring:rgba(168,104,63,.16);
  --on-clay:#fff; --on-clay-soft:rgba(255,255,255,.8);
  --peach:#f0d5c4;  --peach-hi:#f7e2d5;
  --moss:#d6e0cd;   --moss-hi:#e2eade;
  --sky:#cfdde6;    --sky-hi:#dde8ef;
  --sand:#efe0c4;   --sand-hi:#f6ead6;
  --moss-ink:#5a6b50; --sky-ink:#4c6473; --peach-ink:#8e5a41;
  --danger:#96432f; --danger-soft:#e9c9bd;

  --grain:rgba(168,150,128,.035); --grain2:rgba(168,150,128,.028);
  --wash:rgba(255,253,246,.7);
  --edge:rgba(255,255,255,.72);
  --edge-in:rgba(120,98,72,.05);
  --shadow:0 1px 1px rgba(74,60,44,.028), 0 6px 16px -12px rgba(74,60,44,.24);
  --shadow-lift:0 2px 3px rgba(74,60,44,.035), 0 16px 34px -20px rgba(74,60,44,.34);
  --shadow-clay:0 1px 1px rgba(90,50,24,.12), 0 8px 16px -10px rgba(150,88,50,.55);
  --r-sm:12px; --r-md:14px; --r-lg:16px; --r-xl:18px; --r-pill:999px;

  /* ---- 旧变量名 → 新颜色（JS 内联样式靠这几行自动跟着换） ---- */
  --cream:#f7f0e4;      /* 页面底 */
  --cream2:#f2e9d8;     /* 压进纸里的浅块 */
  --ink:#4a3c2c;        /* 主文字（原来是近黑，现在是暖褐） */
  --sub:#7d6a55;        /* 次要文字 */
  --persimmon:#a8683f;  /* 原柿子红 → 陶土棕 */
  --cyan:#4c6473;       /* 原晴山蓝 → 天青的文字色 */
  --bamboo:#5a6b50;     /* 原竹青 → 苔绿的文字色 */
  --glaze:#efe0c4;      /* 原琉璃黄 → 沙 */
  --line:#e5dac7;
  --card:#fdf9f0;
}
/* 深色模式：系统偏好 + 手动切换，双向都能覆盖 */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#211b15; --card-hi:#332b22;
    --ink2:#c1b09a; --ink3:#8f8172; --line-soft:#372e24;
    --clay:#d69465; --clay-hi:#e0a276; --clay-lo:#c88558;
    --clay-soft:#4a382c; --ring:rgba(214,148,101,.2);
    --on-clay:#2a2118; --on-clay-soft:rgba(42,33,24,.72);
    --peach:#5d4436; --peach-hi:#6a5040;
    --moss:#3f4c3a;  --moss-hi:#4a5844;
    --sky:#374751;   --sky-hi:#41535e;
    --sand:#55462d;  --sand-hi:#615137;
    --moss-ink:#c3d2b8; --sky-ink:#bcd2de; --peach-ink:#e8c0a6;
    --danger:#d07a63; --danger-soft:#54332a;
    --grain:rgba(255,240,220,.022); --grain2:rgba(255,240,220,.016);
    --wash:rgba(255,232,200,.04);
    --edge:rgba(255,240,220,.055); --edge-in:rgba(0,0,0,.18);
    --shadow:0 1px 2px rgba(0,0,0,.2);
    --shadow-lift:0 12px 30px -18px rgba(0,0,0,.6);
    --shadow-clay:0 6px 14px -10px rgba(0,0,0,.6);
    --cream:#211b15; --cream2:#2a231b; --ink:#eee4d3; --sub:#c1b09a;
    --persimmon:#d69465; --cyan:#bcd2de; --bamboo:#c3d2b8; --glaze:#55462d;
    --line:#3e3428; --card:#2c251d;
  }
}
:root[data-theme="dark"]{
  --paper:#211b15; --card-hi:#332b22;
  --ink2:#c1b09a; --ink3:#8f8172; --line-soft:#372e24;
  --clay:#d69465; --clay-hi:#e0a276; --clay-lo:#c88558;
  --clay-soft:#4a382c; --ring:rgba(214,148,101,.2);
  --on-clay:#2a2118; --on-clay-soft:rgba(42,33,24,.72);
  --peach:#5d4436; --peach-hi:#6a5040;
  --moss:#3f4c3a;  --moss-hi:#4a5844;
  --sky:#374751;   --sky-hi:#41535e;
  --sand:#55462d;  --sand-hi:#615137;
  --moss-ink:#c3d2b8; --sky-ink:#bcd2de; --peach-ink:#e8c0a6;
  --danger:#d07a63; --danger-soft:#54332a;
  --grain:rgba(255,240,220,.022); --grain2:rgba(255,240,220,.016);
  --wash:rgba(255,232,200,.04);
  --edge:rgba(255,240,220,.055); --edge-in:rgba(0,0,0,.18);
  --shadow:0 1px 2px rgba(0,0,0,.2);
  --shadow-lift:0 12px 30px -18px rgba(0,0,0,.6);
  --shadow-clay:0 6px 14px -10px rgba(0,0,0,.6);
  --cream:#211b15; --cream2:#2a231b; --ink:#eee4d3; --sub:#c1b09a;
  --persimmon:#d69465; --cyan:#bcd2de; --bamboo:#c3d2b8; --glaze:#55462d;
  --line:#3e3428; --card:#2c251d;
}

*{box-sizing:border-box;margin:0;padding:0;}
body{
  /* 圆体只有 Mac / iOS 自带，安卓和 Windows 会 fallback，字体栈要写完整 */
  font-family:"Yuanti SC","STYuanti","Hiragino Sans GB","PingFang SC",
              "Microsoft YaHei",system-ui,-apple-system,sans-serif;
  color:var(--ink);background:var(--paper);
  line-height:1.75;letter-spacing:.2px;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  min-height:100vh;
  /* 纸的质感：纯 CSS，不用图片 */
  background-image:
    radial-gradient(120% 60% at 50% -10%, var(--wash), transparent 62%),
    radial-gradient(var(--grain) .6px, transparent .9px),
    radial-gradient(var(--grain2) .5px, transparent .8px);
  /* 柔光层用 100% 高（fixed 时＝视口高），页面内容少时才不会露出一条硬边 */
  background-size:100% 100%, 5px 5px, 7px 7px;
  background-position:0 0, 0 0, 2px 3px;
  background-repeat:no-repeat, repeat, repeat;
  background-attachment:fixed, scroll, scroll;
}
button,input,textarea,select{font-family:inherit}
.wrap{max-width:920px;margin:0 auto;padding:30px 20px 90px;}
h1,h2,h3{font-weight:600;letter-spacing:.8px;line-height:1.5}
.cn{font-weight:600;}
:focus-visible{outline:2px solid var(--clay);outline-offset:2px;border-radius:var(--r-sm)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}

/* ---- 登录 ---- */
#loginView{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.login-card{
  background:linear-gradient(180deg,var(--card-hi),var(--card));
  border-radius:var(--r-xl);padding:34px 30px;max-width:400px;width:100%;
  box-shadow:inset 0 0 0 1px var(--line-soft),inset 0 1px 0 var(--edge),var(--shadow-lift);
}
/* 印章：空心描边，跟学生端的「閱」「成」同一个做法 */
.login-card .stamp{
  display:inline-flex;align-items:center;justify-content:center;
  width:52px;height:52px;border-radius:15px;margin-bottom:16px;
  color:var(--clay);position:relative;box-shadow:inset 0 0 0 1.8px currentColor;
  font-size:24px;transform:rotate(-6deg);line-height:1;letter-spacing:0;
}
.login-card .stamp::after{content:"";position:absolute;inset:4px;border-radius:10px;box-shadow:inset 0 0 0 1px currentColor;opacity:.42}
.login-card h1{font-size:21px;margin-bottom:6px;letter-spacing:1.4px;}
.login-card p.hint{color:var(--sub);font-size:13px;margin-bottom:20px;line-height:1.8}

label{display:block;font-size:12.5px;font-weight:600;letter-spacing:.4px;color:var(--sub);margin:16px 0 7px;}
input,textarea,select{
  width:100%;padding:12px 14px;border:none;border-radius:var(--r-md);
  font-size:15px;background:var(--paper);outline:none;color:var(--ink);letter-spacing:.2px;
  box-shadow:inset 0 0 0 1px var(--line),inset 0 2px 4px var(--edge-in);
  transition:box-shadow .18s ease;
}
input::placeholder,textarea::placeholder{color:var(--ink3)}
input:focus,textarea:focus,select:focus{box-shadow:inset 0 0 0 1.5px var(--clay),0 0 0 4px var(--ring);}
textarea{min-height:70px;resize:vertical;line-height:1.8}
/* 下拉箭头：内联 SVG（data URI），不引图标库 */
select{
  appearance:none;-webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23a89680' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M5.8 9.2 12 15.4l6.2-6.2'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;background-size:15px;padding-right:36px;
}
input[type=checkbox]{width:auto;box-shadow:none;accent-color:var(--clay)}

.btn{
  border:none;border-radius:var(--r-md);
  background:linear-gradient(180deg,var(--clay-hi),var(--clay) 58%,var(--clay-lo));
  color:var(--on-clay);font-weight:600;font-size:14.5px;letter-spacing:.5px;
  padding:12px 18px;cursor:pointer;line-height:1.5;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.24),var(--shadow-clay);
  transition:transform .16s ease,box-shadow .16s ease;
}
.btn:hover{transform:translateY(-1px);}
.btn:active{transform:translateY(1px);box-shadow:inset 0 2px 5px rgba(90,50,24,.28);}
.btn:disabled{opacity:.55;transform:none;cursor:default;}
.btn.full{width:100%;margin-top:22px;}
.btn.sm{padding:8px 14px;font-size:13px;}
/* 次要动作：淡色块，不抢陶土色 */
.btn.cyan{background:linear-gradient(180deg,var(--sky-hi),var(--sky));color:var(--sky-ink);box-shadow:inset 0 1px 0 var(--edge),var(--shadow);}
.btn.bamboo{background:linear-gradient(180deg,var(--moss-hi),var(--moss));color:var(--moss-ink);box-shadow:inset 0 1px 0 var(--edge),var(--shadow);}
.btn.ghost{background:none;color:var(--ink2);box-shadow:inset 0 0 0 1.5px var(--line);}
.btn.ghost:hover{box-shadow:inset 0 0 0 1.5px var(--clay);color:var(--clay);}
.btn.danger{background:linear-gradient(180deg,var(--danger-soft),var(--danger-soft));color:var(--danger);box-shadow:inset 0 1px 0 var(--edge);}
.btn.gray{background:none;color:var(--ink3);box-shadow:inset 0 0 0 1.5px var(--line);border-style:none;}
.btn.gray:hover{transform:none;}

/* 出错提示：桃色水彩块，不用红框 */
.err{
  display:none;margin-top:16px;padding:11px 15px;border-radius:var(--r-md);
  background:linear-gradient(180deg,var(--peach-hi),var(--peach));color:var(--peach-ink);
  font-size:13.5px;line-height:1.75;box-shadow:inset 0 1px 0 var(--edge);
}
.err.show{display:block;}

/* ---- 后台 ---- */
#appView{display:none;}
.topbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px;}
.topbar h1{font-size:21px;letter-spacing:1.4px;}
.topbar h1 .cn{color:var(--clay);}
.whoami{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:14px;}
.linkbtn{
  background:none;border:none;color:var(--ink2);cursor:pointer;font-size:13px;
  border-bottom:1px solid var(--line);padding-bottom:1px;transition:color .18s ease,border-color .18s ease;
}
.linkbtn:hover{color:var(--clay);border-color:var(--clay);}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px;}
.tab{
  border:none;border-radius:var(--r-md);
  background:linear-gradient(180deg,var(--card-hi),var(--card));
  padding:10px 16px;font-weight:600;font-size:14px;cursor:pointer;color:var(--ink2);
  box-shadow:inset 0 0 0 1px var(--line-soft),inset 0 1px 0 var(--edge),var(--shadow);
  transition:transform .16s ease,color .18s ease;
}
.tab:hover{transform:translateY(-1px);color:var(--ink);}
.tab.active{
  background:linear-gradient(180deg,var(--clay-hi),var(--clay) 58%,var(--clay-lo));
  color:var(--on-clay);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.24),var(--shadow-clay);
}
.panel{display:none;}
.panel.active{display:block;animation:fade .3s both;}
@keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

.sechead{display:flex;align-items:center;gap:10px;margin:0 2px 16px;}
.sechead .dot{width:8px;height:8px;border-radius:50%;background:var(--clay);opacity:.55;}
.sechead span{font-size:12.5px;font-weight:600;letter-spacing:1px;color:var(--sub);}
.muted{color:var(--ink3);font-size:14px;padding:20px 4px;line-height:1.9}

.card2{
  background:linear-gradient(180deg,var(--card-hi),var(--card));
  border-radius:var(--r-lg);padding:16px 18px;margin-bottom:12px;
  box-shadow:inset 0 0 0 1px var(--line-soft),inset 0 1px 0 var(--edge),var(--shadow);
}
.card2.done{box-shadow:inset 0 0 0 1.5px var(--moss),inset 0 1px 0 var(--edge),var(--shadow);}

/* 进度格子 */
.gridwrap{overflow-x:auto;}
table.grid{border-collapse:separate;border-spacing:6px;min-width:520px;}
table.grid th{font-size:11px;letter-spacing:.6px;color:var(--sub);padding:4px;text-align:center;font-weight:600;}
table.grid td.name{font-weight:600;font-size:14px;white-space:nowrap;padding-right:8px;text-align:left;}
.cell{
  width:38px;height:38px;border:none;border-radius:var(--r-sm);
  display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;
  background:var(--paper);color:var(--ink3);
  box-shadow:inset 0 0 0 1px var(--line-soft),inset 0 1px 2px var(--edge-in);
}
.cell.on{
  background:linear-gradient(180deg,var(--moss-hi),var(--moss));color:var(--moss-ink);
  box-shadow:inset 0 1px 0 var(--edge);
}
/* 今天：桃色描边（跟学生端周条一致：桃色＝今天） */
.cell.today{box-shadow:inset 0 0 0 2px var(--peach-ink),inset 0 1px 0 var(--edge);}

.sub-top{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.avatar{
  width:38px;height:38px;flex:0 0 38px;border-radius:var(--r-sm);
  background:linear-gradient(180deg,var(--sand-hi),var(--sand));color:var(--ink2);
  display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;
  box-shadow:inset 0 1px 0 var(--edge);
}
.sub-meta .nm{font-weight:600;font-size:15px;}
.sub-meta .dy{font-size:12px;color:var(--sub);}
.badge{
  font-size:11px;font-weight:600;padding:3px 11px;border-radius:var(--r-pill);
  margin-left:auto;box-shadow:inset 0 1px 0 var(--edge);
}
.badge.pending{background:linear-gradient(180deg,var(--sand-hi),var(--sand));color:var(--ink2);}
.badge.reviewed{background:linear-gradient(180deg,var(--moss-hi),var(--moss));color:var(--moss-ink);}
.answerbox{
  background:var(--paper);border-radius:var(--r-sm);padding:12px 14px;font-size:15px;
  margin-bottom:10px;line-height:1.8;
  box-shadow:inset 0 0 0 1px var(--line-soft),inset 0 1px 2px var(--edge-in);
}
.filebox img{max-width:100%;border-radius:var(--r-sm);margin-bottom:10px;box-shadow:inset 0 0 0 1px var(--line-soft);}
audio{width:100%;margin-bottom:10px;}
/* 已有的评语：斜体（跟学生端看到的一致） */
.fb-existing{
  background:linear-gradient(180deg,var(--sand-hi),var(--sand));color:var(--ink);
  border-radius:var(--r-sm);padding:10px 14px;font-size:14px;margin-bottom:10px;
  font-style:italic;line-height:1.85;box-shadow:inset 0 1px 0 var(--edge);
}
.rowend{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap;}

.stud-row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px dashed var(--line);}
.stud-row .info{flex:1;}
.stud-row .u{font-size:12px;color:var(--sub);}
.stud-row.inactive{opacity:.5;}
.addbox{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
.addbox input{flex:1;min-width:160px;}
.newcode{
  background:linear-gradient(180deg,var(--card-hi),var(--card));border-radius:var(--r-md);
  padding:14px 16px;margin-bottom:16px;font-size:14px;display:none;line-height:1.85;
  box-shadow:inset 0 0 0 1px var(--line-soft),inset 0 1px 0 var(--edge),var(--shadow);
}
.newcode.show{display:block;}
.newcode b{color:var(--clay);font-weight:600}

.task-row{
  background:linear-gradient(180deg,var(--card-hi),var(--card));border-radius:var(--r-md);
  padding:15px 17px;margin-bottom:12px;
  box-shadow:inset 0 0 0 1px var(--line-soft),inset 0 1px 0 var(--edge),var(--shadow);
}
.task-row .dtag{
  display:inline-block;font-weight:600;font-size:12px;letter-spacing:.8px;
  background:linear-gradient(180deg,var(--clay-soft),var(--clay-soft));color:var(--clay);
  padding:3px 11px;border-radius:var(--r-pill);margin-bottom:10px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35);
}
.mediabox{
  margin-top:12px;border:1.5px dashed var(--line);border-radius:var(--r-sm);
  padding:12px 14px;background:var(--paper);
}
.mediabox audio{width:100%;display:block;}
.mediabox img{max-width:220px;border-radius:var(--r-sm);display:block;box-shadow:inset 0 0 0 1px var(--line-soft);}
.mediabox .hint{font-size:12px;color:var(--sub);margin-top:7px;line-height:1.7;}
.mtag{
  font-size:11px;font-weight:600;border:none;border-radius:var(--r-pill);padding:1px 9px;
  background:linear-gradient(180deg,var(--sky-hi),var(--sky));color:var(--sky-ink);margin-left:6px;
  box-shadow:inset 0 1px 0 var(--edge);
}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:560px){.grid2{grid-template-columns:1fr;}}

.toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(90px);
  background:var(--ink);color:var(--paper);padding:12px 22px;border-radius:var(--r-md);
  font-size:13.5px;letter-spacing:.2px;line-height:1.7;max-width:86vw;text-align:center;
  opacity:0;transition:.3s cubic-bezier(.2,1.3,.4,1);z-index:1100;box-shadow:var(--shadow-lift);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.spin{
  width:32px;height:32px;border:2.5px solid var(--line);border-top-color:var(--clay);
  border-radius:50%;margin:30px auto;animation:sp .95s linear infinite;
}
@keyframes sp{to{transform:rotate(360deg);}}

/* 批改：按学生分组，点开看 ta 的作业 */
.stu-review{
  border-radius:var(--r-md);margin-bottom:10px;
  background:linear-gradient(180deg,var(--card-hi),var(--card));overflow:hidden;
  box-shadow:inset 0 0 0 1px var(--line-soft),inset 0 1px 0 var(--edge),var(--shadow);
}
.stu-review-head{display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer;transition:background .18s ease;}
.stu-review-head:hover{background:var(--cream2);}
.stu-review-head .u{font-size:12px;color:var(--sub);}
.stu-review-body{padding:8px 16px 14px;border-top:1px dashed var(--line);}
.chev{font-size:13px;color:var(--ink3);}

/* 学生：桌面表格 */
.stu-table{width:100%;border-collapse:collapse;}
.stu-table th{
  text-align:left;font-size:11px;letter-spacing:.6px;color:var(--sub);font-weight:600;
  padding:8px 10px;border-bottom:1.5px solid var(--line);
}
.stu-table td{padding:11px 10px;border-bottom:1px dashed var(--line);vertical-align:middle;font-size:14px;}
.stu-table tr.inactive{opacity:.5;}
.stu-table .nmcell{display:flex;align-items:center;gap:10px;}
.stu-table .av{
  width:32px;height:32px;flex:0 0 32px;border-radius:var(--r-sm);

  restoreTab();          // 刷新后回到上次看的那一页，而不是每次都跳回「进度」
  loadAll();
}

/* ---------- 标签切换 ---------- */
/* 记住老师正在看哪一页。存在浏览器本地（localStorage），
   刷新、切回页面、重新登录都会回到原来那一页。 */
const TAB_KEY="cai_portal_tab";
function switchTab(name){
  if(!document.getElementById('panel-'+name)) return;   // 名字不认识就不动
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===name));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+name).classList.add('active');
  try{ localStorage.setItem(TAB_KEY,name); }catch(e){}
}
function restoreTab(){
  let name="";
  try{ name=localStorage.getItem(TAB_KEY)||""; }catch(e){}
  // 存的名字对不上（比如以后改了分页），就退回「进度」
  if(name && document.getElementById('panel-'+name)) switchTab(name);
}

/* ---------- 加载数据 ---------- */
async function loadAll(){

}
async function loadTracks(){

function renderTrackNav(){

      html+=list.map(t=>`<div class="tracknav-item sub ${selectedTrackId===t.id?'sel':''}" onclick="selectTrack('${t.id}')"><span class="lv">${LEVEL_LABEL[t.level]||t.level}</span> — ${esc(t.name)}</div>`).join('');

function toggleNav(ty){ navOpen[ty]=!navOpen[ty]; renderTrackNav(); }
function selectTrack(id){ selectedTrackId=id; renderTrackNav(); renderTasksTab(); }

function weekStart(){const d=new Date();const wd=(d.getDay()+6)%7;d.setHours(0,0,0,0);d.setDate(d.getDate()-wd);return d;}
function todayCode(){return DAYS[(new Date().getDay()+6)%7];}

async function loadStudents(){
  const {data,error}=await sb.from('students').select('*').order('created_at',{ascending:true});
  if(error){toast("读学生失败");return;}
  STUDENTS=data||[];renderProgress();renderStudents();
}
async function loadSubs(){
  const {data,error}=await sb.from('submissions')
    .select('*, students(display_name,username), feedback(teacher_comment)')
    .order('submitted_at',{ascending:false});

/* ---------- 进度格子 ---------- */
function renderProgress(){
  const box=document.getElementById('progressBody');
  if(!STUDENTS.length){box.innerHTML='<div class="muted">还没有学生。</div>';return;}
  const ws=weekStart().getTime();
  const done={}; // student_id -> Set(day)
  SUBS.forEach(s=>{ if(new Date(s.submitted_at).getTime()>=ws){ (done[s.student_id]=done[s.student_id]||new Set()).add((s.day||"").toUpperCase()); }});
  const td=todayCode();
  let h='<div class="gridwrap"><table class="grid"><tr><th></th>'+DAYS.map(d=>`<th>${DAYCN[d]}</th>`).join('')+'</tr>';
  STUDENTS.filter(s=>s.active!==false).forEach(s=>{
    h+=`<tr><td class="name">${esc(s.display_name||s.username)}</td>`;
    DAYS.forEach(d=>{const on=done[s.id]&&done[s.id].has(d);
      h+=`<td><div class="cell ${on?'on':''} ${d===td?'today':''}">${on?'✓':''}</div></td>`;});
    h+='</tr>';
  });
  h+='</table></div>';
  box.innerHTML=h;
}

/* ---------- 批改：按学生分组，点名字展开 ---------- */
function toggleReview(sid){ reviewOpen = (reviewOpen===sid?null:sid); renderReview(); }

function submissionCardHTML(s){
  const reviewed=s.status==='reviewed';
  const fb=(s.feedback&&s.feedback.length)?s.feedback[0].teacher_comment:"";
  let content="";
  if(s.type==='text'||(s.text_answer&&!s.file_url)){
    content=`<div class="answerbox">${esc(s.text_answer)||'(空)'}</div>`;
  } else if(s.file_url){
    const url=s.file_url, low=url.toLowerCase();
    if(/\.(mp3|m4a|wav|ogg|aac|webm)($|\?)/.test(low)) content=`<audio controls src="${esc(url)}"></audio>`;
    else if(/\.(mp4|mov|m4v|3gp|avi|mkv)($|\?)/.test(low)) content=`<video controls preload="metadata" src="${esc(url)}" style="width:100%;max-height:420px;border:none;border-radius:14px;background:#000;margin-bottom:10px;box-shadow:inset 0 0 0 1px var(--line-soft);"></video>`;
    else if(/\.(jpg|jpeg|png|gif|webp|heic|heif)($|\?)/.test(low)) content=`<div class="filebox"><a href="${esc(url)}" target="_blank"><img src="${esc(url)}" alt=""></a></div>`;
    else content=`<div class="answerbox"><a href="${esc(url)}" target="_blank">📎 打开附件</a></div>`;
  }
  return `<div class="card2 ${reviewed?'done':''}">
    <div style="display:flex;align-items:center;margin-bottom:8px;">
      <div class="dy" style="font-size:13px;color:var(--sub);">${esc((s.day||'').toUpperCase())} · ${esc(s.task_title||'')} · ${new Date(s.submitted_at).toLocaleDateString()}</div>
      <span class="badge ${reviewed?'reviewed':'pending'}">${reviewed?'已批':'待批'}</span>
    </div>
    ${content}
    ${fb?`<div class="fb-existing">💬 ${esc(fb)}</div>`:''}
    <textarea id="fb_${s.id}" placeholder="写评语…">${esc(fb)}</textarea>
    <div class="rowend"><button class="btn bamboo sm" onclick="saveFeedback('${s.id}')">✓ ${reviewed?'更新评语':'标记已批'}</button></div>
  </div>`;
}

/* 「这题我看不懂」—— 学生点了会出现在批改页最上面。
   这是尺子的兜底：任何尺子都会漏题，学生一点老师就知道该调哪道。
   处理完点「知道了」就消失（resolved=true），不删记录。 */
let TOOHARD=[];
async function loadTooHard(){
  const {data,error}=await sb.rpc('teacher_too_hard');
  if(error){ TOOHARD=[]; renderTooHard(); return; }   // 表还没建就当没有，不打扰老师
  TOOHARD=data||[]; renderTooHard();
}
function renderTooHard(){
  const box=document.getElementById('hardBox'); if(!box) return;
  if(!TOOHARD.length){ box.innerHTML=''; return; }
  box.innerHTML='<div class="card2" style="margin-bottom:14px">'+
    '<div class="sechead"><span class="dot"></span><span>⚠️ 有学生说看不懂 · '+TOOHARD.length+' 条</span></div>'+
    TOOHARD.map(h=>'<div class="ro-day">'+
      '<span class="d">'+esc(DAYCN[h.day]||h.day||'')+'</span>'+
      '<span style="flex:1"><b>'+esc(h.name||'')+'</b> ｜ '+esc(h.title||'（没有标题）')+'</span>'+
      '<button class="btn ghost sm" onclick="resolveTooHard(\''+h.id+'\')">知道了</button>'+
    '</div>').join('')+
    '<div style="font-size:12px;color:var(--sub);margin-top:10px;line-height:1.8">'+
      '去「📖 题库」把这道题改简单，或把它的话题改成学生还没勾的那个，他就不会再拿到了。</div>'+
  '</div>';
}
async function resolveTooHard(id){
  const {error}=await sb.from('too_hard').update({resolved:true}).eq('id',id);
  if(error){ toast('失败：'+error.message); return; }
  await loadTooHard();
}

function renderReview(){
  const box=document.getElementById('reviewBody');
  const onlyPending=document.getElementById('onlyPending').checked;
  const byStu={};
  SUBS.forEach(s=>{ (byStu[s.student_id]=byStu[s.student_id]||[]).push(s); });
  let entries=Object.keys(byStu).map(sid=>{
    const subs=byStu[sid];
    const pending=subs.filter(x=>x.status!=='reviewed').length;
    const nm=subs[0].students?(subs[0].students.display_name||subs[0].students.username):"?";
    const latest=subs.map(x=>x.submitted_at).sort().slice(-1)[0];
    return {sid,subs,pending,nm,latest};
  });
  if(onlyPending) entries=entries.filter(e=>e.pending>0);
  entries.sort((a,b)=> (b.pending-a.pending) || (a.latest<b.latest?1:-1));
  if(!entries.length){box.innerHTML='<div class="muted">'+(onlyPending?'没有待批的了 🎉':'还没有提交。')+'</div>';return;}
  box.innerHTML=entries.map(e=>{
    const open=reviewOpen===e.sid;
    let subs=e.subs.slice();
    if(onlyPending) subs=subs.filter(x=>x.status!=='reviewed');
    subs.sort((a,b)=> a.submitted_at<b.submitted_at?1:-1);
    return `<div class="stu-review">
      <div class="stu-review-head" onclick="toggleReview('${e.sid}')">
        <div class="avatar">${esc((e.nm[0]||'?').toUpperCase())}</div>
        <div style="flex:1;"><div style="font-weight:700;">${esc(e.nm)}</div>
          <div class="u">${e.subs.length} 份提交 · 最近 ${new Date(e.latest).toLocaleDateString()}</div></div>
        ${e.pending?`<span class="badge pending">${e.pending} 待批</span>`:`<span class="badge reviewed">全批完</span>`}
        <span class="chev" style="margin-left:8px;">${open?'▲':'▼'}</span>
      </div>
      ${open?`<div class="stu-review-body">${subs.map(s=>submissionCardHTML(s)).join('')||'<div class="muted">这个学生没有待批的了。</div>'}</div>`:''}
    </div>`;
  }).join('');
}

async function saveFeedback(subId){
  const val=document.getElementById('fb_'+subId).value.trim();
  const sub=SUBS.find(x=>x.id===subId);
  const had=sub&&sub.feedback&&sub.feedback.length;
  let res;
  if(had){ res=await sb.from('feedback').update({teacher_comment:val}).eq('submission_id',subId); }
  else{ res=await sb.from('feedback').insert({submission_id:subId,teacher_comment:val}); }
  if(res.error){toast("保存失败："+res.error.message);return;}
  await sb.from('submissions').update({status:'reviewed'}).eq('id',subId);
  toast("已保存 ✓");
  await loadSubs();
}

    html+=`<div class="grp" onclick="toggleGroup('${tid}')"><b>${open?'▾':'▸'} ${nm}</b><span class="cnt">${groups[tid].length} 人</span></div>`;
    if(open) html+=groups[tid].map(stuItemHtml).join('');
  });

function stuItemHtml(s){
  return `<div class="s-item ${selectedStuId===s.id?'on':''}" onclick="selectStudent('${s.id}')">
    <b>${esc(s.display_name||s.username||'?')}</b>
    <span class="lv">${TYPE_LABEL[s.stu_type]||s.stu_type||'—'} · ${LEVEL_LABEL[s.stu_level]||s.stu_level||'—'}</span></div>`;
}
function toggleSide(){ sideCollapsed=!sideCollapsed; renderStudents(); }
function toggleGroup(t){ tmplGroupOpen[t]=!tmplGroupOpen[t]; renderStudents(); }
function selectStudent(id){ selectedStuId=id; renderStudents(); renderStudentDetail(id); window.scrollTo({top:0,behavior:'smooth'}); }

/* 学生「学过哪些话题」的勾选块。
   这是一对一教学的关键：同是 HSK1，Jin 学到第 3 课、Ashraffaiz 第 14 课，
   勾了什么就只拿什么，不会收到没学过的内容（例：没勾「购物」就不会拿到听价钱）。
   ⚠️ 一个都不勾 = 不过滤 = 拿全部（这是安全默认值，见 supabase_v6_topics.sql 开头）。 */
function studentTopicsHTML(s){
  const list=topicsOf(s.stu_level);
  const on=Array.isArray(s.topics)?s.topics:[];
  const boxes=list.map((t,i)=>'<label class="tpk"><input type="checkbox" id="tp_'+i+'" value="'+esc(t)+'"'+
    (on.indexOf(t)>=0?' checked':'')+'> '+esc(t)+'</label>').join('');
  const note = on.length
    ? '勾了 <b>'+on.length+'/'+list.length+'</b> 个话题 —— 只有这些话题的题目会发给 ta。'
    : '⚠️ <b>一个都没勾 = 不过滤</b>，ta 会拿到这个水平的<b>全部</b>题目，包括还没学过的内容。';
  return '<div class="card2" style="margin-top:12px">'+
    '<div class="sechead"><span class="dot"></span><span>学过哪些话题 · '+
      esc(LEVEL_LABEL[s.stu_level]||s.stu_level||'')+' 共 '+list.length+' 个（HSK 大纲官方话题）</span></div>'+
    '<div class="topicbox">'+boxes+'</div>'+
    '<div class="rowend">'+
      '<button class="btn sm" onclick="saveTopics(\''+s.id+'\')">保存话题</button>'+
      '<button class="btn ghost sm" onclick="pickAllTopics(true)">全选</button>'+
      '<button class="btn ghost sm" onclick="pickAllTopics(false)">全不选</button>'+
    '</div>'+
    '<div class="follow-note" style="margin-top:10px">'+note+'</div>'+
  '</div>';
}
function pickAllTopics(on){
  document.querySelectorAll('.topicbox input[type=checkbox]').forEach(c=>{c.checked=on;});
}
async function saveTopics(id){
  const picked=[...document.querySelectorAll('.topicbox input[type=checkbox]')]
    .filter(c=>c.checked).map(c=>c.value);
  // 一个都没勾就存 null（＝不过滤），别存空数组 —— SQL 那边两者行为一样，但 null 更清楚
  const {error}=await sb.from('students').update({topics:picked.length?picked:null}).eq('id',id);
  if(error){ toast('保存失败：'+error.message); return; }
  toast(picked.length?('已保存 ✓ 勾了 '+picked.length+' 个话题'):'已清空 —— 这个学生会拿到全部题目');
  await loadStudents(); selectStudent(id);
}

async function renderStudentHomework(s){
  const box=document.getElementById('stuHw'); if(!box) return;
  const order={MON:1,TUE:2,WED:3,THU:4,FRI:5,SAT:6,SUN:7};
  if(!s.track_id){
    box.innerHTML=`<div class="muted" style="font-size:13px;">这个学生用「默认（通用）」作业。想给 ta 专属内容 → 点上面「🔧 单独定制」。</div>`;
    return;
  }
  const {data,error}=await sb.from('track_tasks').select('*').eq('track_id',s.track_id);
  if(error){box.innerHTML='<div class="muted">读作业失败</div>';return;}
  const rows=(data||[]).sort((a,b)=>(order[a.day]||9)-(order[b.day]||9));
  if(s.is_custom){
    box.innerHTML=rows.map(t=>taskRowHTML(t,true)).join('')||'<div class="muted">这套还没有作业。点上面「📋 从模板套一份」。</div>';
  } else {
    const t=TRACKS.find(x=>x.id===s.track_id);
    box.innerHTML=`<div class="follow-note">这是 ta 跟随的模板「<b>${t?esc(t.name):'—'}</b>」的内容。想改所有跟随者 → 去 <b>📚模板库</b> 改；只想单独给 ta 改 → 点上面「🔧 单独定制」。</div>`+
      (rows.map(t=>{
        const k=mediaKind(t.media_url);
        const mt = k==='audio'?'<span class="mtag">🔊 语音</span>' : k==='image'?'<span class="mtag">🖼️ 图</span>' : '';
        return `<div class="ro-day"><span class="d">${DAYCN[t.day]||t.day}</span>
        <span class="k">${t.type==='text'?'打字':'上传'}</span>
        <span style="flex:1;font-size:14px;${t.active===false?'opacity:.5;':''}">${esc(t.title)||'(空)'}${t.active===false?' · 休息':''}${mt}</span></div>`;
      }).join('')||'<div class="muted">这个模板还没有作业。</div>');
  }
}

async function submitAddStudent(){
  const name=document.getElementById('as_name').value.trim();
  const type=document.getElementById('as_type').value;
  const level=document.getElementById('as_level').value;
  if(!name){toast('请填名字');return;}
  if(!type||!level){toast('请选类型和水平');return;}
  const {data,error}=await sb.rpc('admin_upsert_student',{p_id:null,p_display_name:name,p_type:type,p_level:level});
  if(error){toast('加失败：'+error.message);return;}
  const username=data, link=studentLink(username);
  await loadStudents();
  let ns=STUDENTS.find(x=>x.username===username);
  /* ⚠️ 关键一步，别删：`admin_upsert_student` 的 insert【没有】设 track_id
     （只有学生自助注册的 register_student 才调 match_template）。
     不补这一刀，老师后台建出来的学生 track_id 是 null → 掉进「默认套餐」→
     永远拿不到自动排课，而且界面上看不出来。
     这里用的是跟 saveProfile() 完全一样的做法：admin_follow_template(id, null) 会重新匹配。 */
  if(ns){
    const {error:fe}=await sb.rpc('admin_follow_template',{p_student_id:ns.id,p_track_id:null});
    if(fe){ toast('配模板失败：'+fe.message); }
    else { await loadStudents(); ns=STUDENTS.find(x=>x.username===username); }
  }
  const tk=ns&&ns.track_id?TRACKS.find(t=>t.id===ns.track_id):null;
  // 配到了有配方的模板才是自动排课；没配到／配到没配方的都要当场说清楚
  const note = tk&&tk.recipe
    ? `<div class="follow-note" style="margin-top:10px">已自动配上模板 <b>${esc(tk.name)}</b>，作业由系统每周自动组。</div>`
    : `<div class="follow-note" style="margin-top:10px">⚠️ <b>没有配到带配方的模板</b>，这个学生现在拿的是默认作业，<b>不是自动排课</b>。<br>
        去「📚 模板库」确认有一个「${esc(TYPE_LABEL[type]||type)} + ${esc(LEVEL_LABEL[level]||level)}」且设了配方的模板，再回来点「🔄 重新配模板」。</div>`;
  const r=document.getElementById('as_result');
  if(r) r.innerHTML=`<div class="newcode show" style="margin-top:12px;">✅ 建好了：<b>${esc(name)}</b> → 登录码 <b>${esc(username)}</b><br>打卡链接：<br><a href="${esc(link)}" target="_blank">${esc(link)}</a>
    ${note}
    <div class="rowend" style="margin-top:10px;">${ns?`<button class="btn bamboo sm" onclick="customize('${ns.id}')">🔧 单独定制（给 ta 专属作业）</button>`:''}</div>
    <span style="color:var(--sub);font-size:12px;">或以后从左边点开 ta 再定制。</span></div>`;
}

/* 查某个模板每个技能【实际可用】的题数。
   ⚠️⚠️ 过滤规则【必须】跟 build_week_tasks() 里的完全一致，否则警告会骗人：
     · 听力题没有 media_url → 组周时会被排除，这里也不能算
     · 纯口语模板（type='oral'）→ 只能用标了 description_pinyin 的题
   曾经写过一版只数总题数的，结果后台显示「听 8 道够用」，
   而实际可用是 0（一段录音都没有），那几天全是空的。 */
async function poolCounts(track){
  const {data,error}=await sb.from('questions')
    .select('skill,media_url,description_pinyin')
    .eq('level',track.level).eq('active',true);
  if(error){ toast("读题库失败："+error.message); return {}; }
  const oralOnly=(track.type==='oral');
  const out={};
  (data||[]).forEach(q=>{
    if(q.skill==='listen' && !String(q.media_url||'').trim()) return;
    if(oralOnly && !String(q.description_pinyin||'').trim()) return;
    out[q.skill]=(out[q.skill]||0)+1;
  });
  return out;
}

/* 模板的「配方」编辑块：五个数字框 + 一周几天 + 缺题警告 */
function recipeBoxHTML(track, counts){
  const rc=track.recipe||{};

  const rows=SKILL_ORDER.map(s=>{
    const n=parseInt(rc[s]||0,10)||0; total+=n;

    if(n>0 && have===0) warn.push('缺 '+SKILL_CN[s]+' 的题');

      '<span style="color:var(--ink3);font-weight:400"> · 池子 '+have+' 道</span></label>'+

  }).join('');
  return '<div class="card2"><div class="sechead"><span class="dot"></span>'+
    '<span>每周配方 · 系统按这个自动组一周作业</span></div>'+
    '<div class="grid2" style="grid-template-columns:repeat(5,1fr)">'+rows+'</div>'+

    '<span class="chip">一周 '+total+' 天</span></div>'+

async function saveRecipe(trackId){

    const el=document.getElementById('rc_'+s);
    if(!el){ toast("页面已变，请重新选一次模板"); return; }
    const n=parseInt(el.value,10)||0;
    if(n>0){ rc[s]=n; total+=n; }

  if(total>7){ toast("一周最多 7 天，现在是 "+total+" 天"); return; }
  const {error}=await sb.from('tracks').update({recipe:rc}).eq('id',trackId);
  if(error){ toast("保存失败："+error.message); return; }
  toast("配方已保存 ✓ 本周立刻生效");

}

   用的是 build_week_tasks() —— 跟学生端拿题走的【同一个函数】，
   所以这里看到的就是学生会看到的，不是另算一套。 */
const PREVIEW_LABEL=['本周','下周','第 3 周','第 4 周'];
async function previewWeeks(trackId){
  const box=document.getElementById('previewBox'); if(!box) return;
  const t=TRACKS.find(x=>x.id===trackId);
  if(t && !t.recipe){
    box.innerHTML='<div class="muted">这个模板还没有配方。先在上面填好数字、点「保存配方」，再看预览。</div>';
    return;
  }
  box.innerHTML='<div class="spin"></div>';
  const {data:wi,error:we}=await sb.rpc('week_index');
  // 不做这个检查的话：wi 是 undefined → wi+k 变成 NaN → 传进 SQL 报错但看不出原因
  if(we || typeof wi!=='number'){

  let html='<div class="sechead" style="margin-top:16px"><span class="dot"></span>'+

  for(let k=0;k<4;k++){

    if(error){ box.innerHTML='<div class="muted">预览失败：'+esc(error.message)+'</div>'; return; }
    const rows=(data||[]).map(t=>

          (rows||'<div class="muted">这周排不出作业 —— 池子里没有可用的题。</div>')+'</div>';
  }
  box.innerHTML=html;
}

/* ---------- 题库（自动排课的题从这里来） ---------- */
let QUESTIONS=[], bankSkill='', bankLevel='', bankQ='', bankOpen={};

async function loadQuestions(){
  const {data,error}=await sb.from('questions').select('*')
    .order('skill').order('level').order('created_at');
  if(error){ toast("读题库失败："+error.message); return; }
  QUESTIONS=data||[]; renderBank();
}
/* 当前筛选＋搜索之后剩下哪些题 */
function bankList(){
  const kw=bankQ.trim().toLowerCase();
  return QUESTIONS.filter(q=>{
    if(bankSkill && q.skill!==bankSkill) return false;
    if(bankLevel && q.level!==bankLevel) return false;
    if(!kw) return true;
    return [q.code,q.title,q.title_en,q.description,q.description_en]
      .some(v=>String(v||'').toLowerCase().includes(kw));
  });
}
/* 整个题库页重画（筛选条 + 列表）。搜索框在静态 HTML 里，不在这里重画 —— 重画会掉输入焦点 */
function renderBank(){ renderBankFilters(); renderBankList(); }

function renderBankFilters(){
  const box=document.getElementById('bankFilters'); if(!box) return;
  box.innerHTML=
    '<div class="frow"><span class="fl">技能</span>'+
    ['',...SKILL_ORDER].map(s=>'<button class="f'+(bankSkill===s?' on':'')+
      '" onclick="bankSkill=\''+s+'\';renderBank()">'+(s?SKILL_CN[s]:'全部')+'</button>').join('')+
    '</div><div class="frow"><span class="fl">水平</span>'+
    ['',...LEVEL_KEYS].map(l=>'<button class="f'+(bankLevel===l?' on':'')+
      '" onclick="bankLevel=\''+l+'\';renderBank()">'+(l?LEVEL_LABEL[l]:'全部')+'</button>').join('')+
    '<span class="count" id="bankCount"></span></div>';
}

/* 列表：一行一道，只显示编号/标题/毛病。点一行才展开编辑器。 */
function renderBankList(){
  const box=document.getElementById('bankBody'); if(!box) return;
  const list=bankList();
  const c=document.getElementById('bankCount'); if(c) c.textContent=list.length+' 道';
  if(!list.length){
    box.innerHTML='<div class="muted">'+(bankQ.trim()?'没搜到。换个词，或把上面的筛选点回「全部」。'
      :'这个条件下还没有题。点右上角「＋ 加一道题」。')+'</div>';
    return;
  }
  box.innerHTML=list.map(q=>{
    const flags=[];
    // 这两条跟 build_week_tasks() 的安全规则一一对应，是「这道题会不会被跳过」的直接原因
    // 「要不要录音」看 needs_audio，不是看技能 —— 发音题 P7、说话题 S12 也写了「听我念…」
    if(needsAudio(q) && !String(q.media_url||'').trim())      flags.push('缺录音');
    if(!String(q.description_pinyin||'').trim())              flags.push('缺拼音');
    // 没标话题的题谁都拿得到 —— 包括还没学过这个内容的学生，所以要标出来。
    // 发音题例外：声调、轻声、变调跟「学过什么内容」无关，本来就该谁都能做，不标话题是对的。
    if(q.skill!=='pinyin' && !String(q.topic||'').trim())     flags.push('缺话题');
    return '<div class="qrow'+(bankOpen[q.id]?' open':'')+'" id="qr_'+q.id+'">'+
      '<div class="qhead" onclick="toggleQ(\''+q.id+'\')">'+
        '<span class="qk">'+esc(SKILL_CN[q.skill]||q.skill)+'</span>'+
        '<span class="qc">'+esc(LEVEL_LABEL[q.level]||q.level)+(q.code?' · '+esc(q.code):'')+'</span>'+
        '<span class="qt">'+esc(q.title||'（没有标题）')+'</span>'+
        flags.map(f=>'<span class="qf">'+f+'</span>').join('')+
        '<span class="qc">'+(bankOpen[q.id]?'▾':'▸')+'</span>'+
      '</div>'+
      '<div class="qbody" id="qb_'+q.id+'">'+(bankOpen[q.id]?questionEditorHTML(q):'')+'</div>'+
    '</div>';
  }).join('');
}

/* 展开／收起一道题。
   ⚠️ 这里【只动这一行】，不调 renderBankList() —— 整页重画会把【其它已展开、还没保存】的编辑冲掉。 */
function toggleQ(id){
  const q=QUESTIONS.find(x=>x.id===id); if(!q) return;
  const body=document.getElementById('qb_'+id), row=document.getElementById('qr_'+id);
  if(!body||!row) return;
  if(bankOpen[id]){ delete bankOpen[id]; body.innerHTML=''; row.classList.remove('open'); }
  else            { bankOpen[id]=true;   body.innerHTML=questionEditorHTML(q); row.classList.add('open'); }
  const chev=row.querySelector('.qhead .qc:last-child');
  if(chev) chev.textContent=bankOpen[id]?'▾':'▸';
}

function questionEditorHTML(q){
    const noPy   = !((q.description_pinyin||'').trim());
    const noMedia= !((q.media_url||'').trim());
    // 跟 build_week_tasks() 的两条安全规则对应：听力题没录音进不了池子
    const warn = (q.skill==='listen' && noMedia)
      ? '<div class="follow-note" style="margin-top:8px">⚠️ 听力题没有录音，<b>自动排课会跳过它</b>。传了语音才算数。</div>' : '';
    return ''+
      '<div class="grid2" style="margin-bottom:8px">'+
        '<input id="q_title_'+q.id+'" value="'+esc(q.title||'')+'" placeholder="标题">'+
        '<input id="q_title_en_'+q.id+'" value="'+esc(q.title_en||'')+'" placeholder="标题英文">'+
      '</div>'+
      '<textarea id="q_desc_'+q.id+'" placeholder="题目正文">'+esc(q.description||'')+'</textarea>'+
      '<textarea id="q_desc_en_'+q.id+'" placeholder="正文英文（学生靠这个看懂要求）">'+esc(q.description_en||'')+'</textarea>'+
      '<textarea id="q_desc_py_'+q.id+'" placeholder="正文拼音（纯口语学生只看这一份，指令也要标）">'+esc(q.description_pinyin||'')+'</textarea>'+

/* 题库里每道题的语音／图片。
   ⚠️ 【绝对不能】复用 mediaBlockHTML / uploadMedia / removeMedia ——
   那三个的目标表写死是 track_tasks 或 task_templates，永远不会写 questions 表，
   拿来用会「看起来成功、其实没保存」。这一套的目标表写死成 questions。 */
/* 这道题要不要老师录音才成立。
   needs_audio 没设过（null）→ 退回旧行为，按「是不是听力题」判断。
   ⚠️ 这个判断必须跟 build_week_tasks() 里的 SQL 完全一致，否则后台的「缺录音」会骗人。 */
function needsAudio(q){
  return (q.needs_audio===null||q.needs_audio===undefined) ? (q.skill==='listen') : !!q.needs_audio;
}
function questionMediaHTML(q){
  const u=q.media_url||'';
  let show='<div class="hint">还没有语音／图片。听力题和发音题一定要传，不然学生看到的是一道没声音的题。</div>';
  if(u){
    const low=u.toLowerCase();
    if(/\.(mp3|m4a|wav|ogg|aac|webm)($|\?)/.test(low)) show='<audio controls src="'+esc(u)+'"></audio>';
    else if(/\.(jpg|jpeg|png|gif|webp|heic|heif)($|\?)/.test(low)) show='<img src="'+esc(u)+'" alt="">';
    else show='<a href="'+esc(u)+'" target="_blank" rel="noopener">附件</a>';
  }
  // 录音的四种状态：没在录 / 准备中 / 录音中 / 录好了还没采用
  const na=needsAudio(q);
  const naBox='<label style="display:flex;align-items:center;gap:7px;margin:8px 0 0;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer">'+
    '<input type="checkbox" id="q_na_'+q.id+'" style="width:auto;margin:0"'+(na?' checked':'')+
    ' onchange="saveNeedsAudio(\''+q.id+'\',this.checked)"> 这道题必须有老师录音'+
    '<span style="font-weight:400;color:var(--ink3)">（勾了但没录音 → 自动排课会跳过它）</span></label>';
  const st=QREC[q.id]||{};
  let rec;
  if(st.on && st.warm){
    rec='<button class="btn sm" onclick="qStopRec(\''+q.id+'\')">⏳ 准备中…先别说话</button>';
  }else if(st.on){
    rec='<button class="btn sm" onclick="qStopRec(\''+q.id+'\')">⏹ 请说！点这里停 · <span id="qrt_'+q.id+'">0:00</span></button>';
  }else if(st.url){
    rec='<audio controls src="'+st.url+'" style="margin:6px 0"></audio>'+
        '<div class="rowend"><button class="btn sm" onclick="qUseRec(\''+q.id+'\')">✓ 就用这段</button>'+
        '<button class="btn ghost sm" onclick="qStartRec(\''+q.id+'\')">重录</button></div>';
  }else{
    rec='<button class="btn cyan sm" onclick="qStartRec(\''+q.id+'\')">🎙 直接录音</button>'+
        '<button class="btn cyan sm" onclick="document.getElementById(\'qf_'+q.id+'\').click()">传文件</button>'+
        (u?'<button class="btn ghost sm" onclick="removeQuestionMedia(\''+q.id+'\')">移除</button>':'');
  }
  return '<div class="mediabox" id="qm_'+q.id+'"><div><b>题目的语音／图片</b>'+
    (u?'<span class="mtag">已有</span>':'')+'</div>'+show+
    '<input type="file" id="qf_'+q.id+'" style="display:none" onchange="uploadQuestionMedia(\''+q.id+'\')">'+
    (st.url?rec:'<div class="rowend">'+rec+'</div>')+naBox+
    '</div>';
}
/* 勾/取消「必须有录音」。单独存，不用点保存 —— 跟传语音一样是即时生效的动作。 */
async function saveNeedsAudio(id,on){
  const {error}=await sb.from('questions').update({needs_audio:!!on}).eq('id',id);
  if(error){ toast('保存失败：'+error.message); return; }
  const q=QUESTIONS.find(x=>x.id===id); if(q) q.needs_audio=!!on;
  toast(on?'已标记「必须有录音」':'已取消 —— 这题没录音也会照常发');
  renderBankList();
}

/* ---------- 题库页「直接录音」（写 questions 表）----------
   ⚠️ 不能复用老师端的 tStartRec/tUseRec —— 那一套的目标表写死是
   track_tasks / task_templates，永远不会写 questions。
   状态也分开放在 QREC，跟作业页的 TREC 互不干扰。 */
const QREC={};
function refreshQuestionMedia(id){
  const q=QUESTIONS.find(x=>x.id===id);
  const box=document.getElementById('qm_'+id);
  if(!q||!box) return;
  box.outerHTML=questionMediaHTML(q);   // 只重画这一个媒体块，不碰同页其它未保存的编辑
}
async function qStartRec(id){
  if(!tCanRec()){ toast("这个浏览器不能录音，请用「传文件」"); return; }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const mime=tMime();
    const mr= mime? new MediaRecorder(stream,{mimeType:mime}) : new MediaRecorder(stream);
    const chunks=[]; let live=false, onLive=null;
    mr.ondataavailable=e=>{ if(e.data&&e.data.size){ chunks.push(e.data); if(!live){ live=true; if(onLive) onLive(); } } };
    mr.onstop=()=>{
      try{ stream.getTracks().forEach(x=>x.stop()); }catch(e){}
      const s=QREC[id]||{}; clearInterval(s.timer);
      const blob=new Blob(chunks,{type:mr.mimeType||mime||"audio/webm"});
      if(blob.size<1200){ delete QREC[id]; refreshQuestionMedia(id); toast("好像没录到声音，请再试一次"); return; }
      if(s.url) URL.revokeObjectURL(s.url);
      s.blob=blob; s.url=URL.createObjectURL(blob); s.on=false;
      QREC[id]=s; refreshQuestionMedia(id);
    };
    if(QREC[id]&&QREC[id].url) URL.revokeObjectURL(QREC[id].url);
    QREC[id]={mr,stream,on:true,warm:true,t0:0,timer:null,blob:null,url:null};
    refreshQuestionMedia(id);
    mr.start(250);                       // 立刻开录，早说也不丢
    // 等「真的有声音进来」才叫人说话 —— 第一次用麦克风时设备初始化很慢，固定延时不可靠
    await new Promise(res=>{ if(live) return res(); onLive=res; setTimeout(res,3000); });
    const s=QREC[id];
    if(!s||!s.on){ try{ mr.state!=='inactive'&&mr.stop(); }catch(e){}
                   try{ stream.getTracks().forEach(x=>x.stop()); }catch(e){} return; }
    s.warm=false; s.t0=Date.now();
    s.timer=setInterval(()=>{
      const c=QREC[id]; if(!c) return;
      const el=document.getElementById('qrt_'+id), ms=Date.now()-c.t0;
      if(el) el.textContent=Math.floor(ms/60000)+":"+String(Math.floor(ms/1000)%60).padStart(2,"0");
      if(ms>5*60*1000) qStopRec(id);
    },250);
    refreshQuestionMedia(id);
  }catch(e){ delete QREC[id]; refreshQuestionMedia(id); toast("不能录音：请允许使用麦克风"); }
}
function qStopRec(id){
  const s=QREC[id]; if(!s||!s.on) return;
  if(s.warm){                            // 还在热身就取消
    s.on=false;
    try{ s.stream&&s.stream.getTracks().forEach(x=>x.stop()); }catch(e){}
    clearInterval(s.timer); delete QREC[id]; refreshQuestionMedia(id); return;
  }
  try{ if(s.mr.state==='recording') s.mr.requestData(); s.mr.stop(); }
  catch(e){ s.on=false; refreshQuestionMedia(id); }
}
async function qUseRec(id){
  const s=QREC[id]; if(!s||!s.blob){ toast("还没有录音"); return; }
  toast("上传中…请等一下");
  const ext=tExt(s.blob.type);
  const path='task-media/'+Date.now()+'_'+Math.random().toString(36).slice(2,8)+'.'+ext;
  const up=await sb.storage.from('uploads').upload(path,s.blob,{cacheControl:'3600',upsert:false,contentType:s.blob.type});
  if(up.error){ toast("上传失败："+up.error.message); return; }
  const url=sb.storage.from('uploads').getPublicUrl(path).data.publicUrl;
  const {error}=await sb.from('questions').update({media_url:url}).eq('id',id);   // 目标表写死 questions
  if(error){ toast("保存失败："+error.message); return; }
  if(s.url) URL.revokeObjectURL(s.url);
  delete QREC[id];
  toast("加好了 ✓ 学生就能听到了");
  await loadQuestions();
}
async function uploadQuestionMedia(id){
  const el=document.getElementById('qf_'+id); const f=el&&el.files[0]; if(!f) return;
  toast("上传中…");
  const ext=(f.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,5)||'bin';
  const path='task-media/'+Date.now()+'_'+Math.random().toString(36).slice(2,8)+'.'+ext;
  const {error:upErr}=await sb.storage.from('uploads').upload(path,f);
  if(upErr){ toast("上传失败："+upErr.message); return; }
  const url=SUPABASE_URL+"/storage/v1/object/public/uploads/"+encodeURI(path);
  const {error}=await sb.from('questions').update({media_url:url}).eq('id',id);
  if(error){ toast("保存失败："+error.message); return; }
  toast("传好了 ✓"); await loadQuestions();
}
async function removeQuestionMedia(id){
  if(!confirm("移除这道题的语音／图片？听力题移除后自动排课会跳过它。")) return;
  const {error}=await sb.from('questions').update({media_url:null}).eq('id',id);
  if(error){ toast("失败："+error.message); return; }
  toast("已移除"); await loadQuestions();
}

async function saveQuestion(id){
  const v=k=>{const el=document.getElementById('q_'+k+'_'+id); return el?el.value.trim():null;};
  const sel=k=>{const el=document.getElementById('q_'+k+'_'+id); return el?el.value:null;};
  const payload={
    title:v('title'), title_en:v('title_en'),
    description:v('desc'), description_en:v('desc_en'),
    description_pinyin:v('desc_py')||null,
    example:v('ex')||null, example_pinyin:v('ex_py')||null,
    skill:sel('skill'), level:sel('level'), answer_type:sel('at'),
    topic:(sel('topic')||null),
    say_mode:(sel('saym')||null),
    say_text:(v('say')||null), say_pinyin:(v('saypy')||null)
  };
  const {error}=await sb.from('questions').update(payload).eq('id',id);

  toast("已保存 ✓");
  await loadQuestions();

async function deleteQuestion(id){

/* ---------- 作业的语音 / 图片 ---------- */
function mediaKind(u){
  const low=String(u||'').toLowerCase();
  if(/\.(mp3|m4a|wav|ogg|aac|webm)($|\?)/.test(low)) return 'audio';
  if(/\.(jpg|jpeg|png|gif|webp|heic|heif)($|\?)/.test(low)) return 'image';
  return u?'file':'';
}
function mediaBlockHTML(t,isTrack){
  const u=t.media_url||'';
  let inner;
  if(u){
    const k=mediaKind(u);
    const prev = k==='audio' ? `<audio controls preload="none" src="${esc(u)}"></audio>`
               : k==='image' ? `<img src="${esc(u)}" alt="">`
               : `<a href="${esc(u)}" target="_blank" rel="noopener">📎 打开附件</a>`;
    inner=`${prev}<div class="rowend" style="margin-top:8px;">
      <button class="btn danger sm" onclick="removeMedia('${t.id}',${isTrack})">移除</button></div>`;
  } else {
    const st=TREC[t.id];
    if(st && st.warm){
      inner=`<button class="btn ghost sm" onclick="tStopRec('${t.id}')">⏳ 准备中… 先别说话</button>`;
    } else if(st && st.on){
      inner=`<button class="btn danger sm" onclick="tStopRec('${t.id}')">⏹ 请说！录音中 <span id="trt_${t.id}">0:00</span> · 点一下停</button>`;
    } else if(st && st.url){
      inner=`<audio controls src="${st.url}"></audio>
        <div class="rowend" style="margin-top:8px;">
          <button class="btn bamboo sm" onclick="tUseRec('${t.id}',${isTrack})">✓ 就用这段</button>
          <button class="btn ghost sm" onclick="tStartRec('${t.id}',${isTrack})">🔄 重录</button>
        </div>`;
    } else {
      inner=`<div class="rowend" style="justify-content:flex-start;">
          <button class="btn cyan sm" onclick="tStartRec('${t.id}',${isTrack})">🎙️ 直接录一段</button>
          <label class="btn ghost sm" for="m_${t.id}" style="display:inline-block;">📁 选文件</label>
          <input type="file" id="m_${t.id}" accept="audio/*,image/*" style="display:none"
            onchange="uploadMedia('${t.id}',${isTrack},this)">
        </div>
        <div class="hint"><b>直接录一段</b>＝对着电脑麦克风说，不用手机传来传去。<br>
        传<b>语音</b>→学生看到大喇叭按钮（听力、跟读、拼音题用）。<br>传<b>图片</b>→学生看到图（看图说话用）。最大 50MB。</div>`;
    }
  }
  return `<div class="mediabox" data-task="${t.id}" data-track="${isTrack?1:0}" data-media="${esc(t.media_url||'')}">
    <label>🔊 语音 / 🖼️ 图片（可空）</label>${inner}</div>`;
}

/* 只重画「这一条作业」的媒体框，不去重查数据库。
   录音时的状态切换必须走这里——用 refreshTaskViews() 会触发两次异步查询互相抢跑，
   界面会卡在「准备中」不动。 */
function refreshMediaBox(id,isTrack){
  const box=document.querySelector('.mediabox[data-task="'+id+'"]');
  if(!box){ refreshTaskViews(); return; }        // 找不到就退回整页刷新
  if(isTrack===undefined) isTrack = box.getAttribute('data-track')==='1';
  const t={id:id, media_url: box.getAttribute('data-media')||null};
  const tmp=document.createElement('div');
  tmp.innerHTML=mediaBlockHTML(t,isTrack);
  box.replaceWith(tmp.firstElementChild);
}

/* ---------- 老师直接录音 ---------- */
const TREC={};
function tCanRec(){ return !!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder); }
function tMime(){
  for(const m of ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus']){
    try{ if(MediaRecorder.isTypeSupported(m)) return m; }catch(e){}
  }
  return "";
}
function tExt(type){
  const t=String(type||"");
  if(/mp4|m4a|aac/.test(t)) return "m4a";
  if(/ogg/.test(t)) return "ogg";
  if(/wav/.test(t)) return "wav";
  return "webm";
}
async function tStartRec(id,isTrack){
  if(!tCanRec()){ toast("这个浏览器不能录音，请用「选文件」"); return; }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const mime=tMime();
    const mr= mime? new MediaRecorder(stream,{mimeType:mime}) : new MediaRecorder(stream);
    const chunks=[];
    let live=false, onLive=null;
    mr.ondataavailable=e=>{
      if(e.data&&e.data.size){
        chunks.push(e.data);
        if(!live){ live=true; if(onLive) onLive(); }   // 确认声音真的进来了
      }
    };
    mr.onstop=()=>{
      try{ stream.getTracks().forEach(x=>x.stop()); }catch(e){}
      const st=TREC[id]||{};
      clearInterval(st.timer);
      const type=mr.mimeType||mime||"audio/webm";
      const blob=new Blob(chunks,{type});
      if(blob.size<1200){                   // 基本等于没录到
        st.on=false; delete TREC[id]; refreshMediaBox(id,isTrack);
        toast("好像没录到声音，请再试一次");
        return;
      }
      if(st.url) URL.revokeObjectURL(st.url);
      st.blob=blob; st.url=URL.createObjectURL(blob); st.on=false;
      TREC[id]=st; refreshMediaBox(id,isTrack);
    };
    if(TREC[id]&&TREC[id].url) URL.revokeObjectURL(TREC[id].url);
    TREC[id]={mr,stream,on:true,warm:true,t0:0,timer:null,blob:null,url:null};
    refreshMediaBox(id,isTrack);            // 先显示「准备中…先别说话」

    // 立刻开录，早说也不会丢
    mr.start(250);
    // 等到「真的有声音数据进来」才叫人说话。
    // 固定等一个时间不行：第一次用麦克风时电脑要初始化设备，会慢很多（就是你遇到的「第一次录不到」）。
    await new Promise(res=>{
      if(live) return res();
      onLive=res;
      setTimeout(res,3000);                 // 兜底：最多等 3 秒
    });
    const st=TREC[id];
    if(!st || !st.on){
      try{ mr.state!=='inactive' && mr.stop(); }catch(e){}
      try{ stream.getTracks().forEach(x=>x.stop()); }catch(e){}
      return;
    }
    st.warm=false; st.t0=Date.now();
    st.timer=setInterval(()=>{
      const s=TREC[id]; if(!s) return;
      const el=document.getElementById('trt_'+id);
      const ms=Date.now()-s.t0;
      if(el) el.textContent=Math.floor(ms/60000)+":"+String(Math.floor(ms/1000)%60).padStart(2,"0");
      if(ms>5*60*1000) tStopRec(id);
    },250);
    refreshMediaBox(id,isTrack);            // 变成「请说！录音中」
  }catch(e){ delete TREC[id]; refreshMediaBox(id,isTrack); toast("不能录音：请允许使用麦克风"); }
}
function tStopRec(id){
  const st=TREC[id];
  if(!st || !st.on) return;
  if(st.warm){                              // 热身期间取消
    st.on=false;
    try{ st.stream && st.stream.getTracks().forEach(x=>x.stop()); }catch(e){}
    clearInterval(st.timer);
    delete TREC[id]; refreshMediaBox(id); return;
  }
  try{
    if(st.mr.state==='recording'){ st.mr.requestData(); }
    st.mr.stop();
  }catch(e){ st.on=false; refreshMediaBox(id); }
}
async function tUseRec(id,isTrack){
  const st=TREC[id]; if(!st||!st.blob){ toast("还没有录音"); return; }
  toast("上传中…请等一下");
  const ext=tExt(st.blob.type);
  const path=`task-media/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
  const up=await sb.storage.from('uploads').upload(path,st.blob,{cacheControl:'3600',upsert:false,contentType:st.blob.type});
  if(up.error){ toast("上传失败："+up.error.message); return; }
  const url=sb.storage.from('uploads').getPublicUrl(path).data.publicUrl;
  const table=isTrack?'track_tasks':'task_templates';
  const {error}=await sb.from(table).update({media_url:url}).eq('id',id);
  if(error){ toast("保存失败："+error.message); return; }
  if(st.url) URL.revokeObjectURL(st.url);
  delete TREC[id];
  toast("加好了 ✓ 学生就能听到了");
  refreshTaskViews();
}
async function uploadMedia(id,isTrack,input){
  const f=input.files&&input.files[0]; if(!f) return;
  if(f.size>50*1024*1024){ toast("文件太大，最多 50MB"); input.value=""; return; }
  toast("上传中…请等一下");
  const ext=((f.name.split('.').pop())||'bin').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,5);
  const path=`task-media/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
  const up=await sb.storage.from('uploads').upload(path,f,{cacheControl:'3600',upsert:false});
  if(up.error){ toast("上传失败："+up.error.message); input.value=""; return; }
  const url=sb.storage.from('uploads').getPublicUrl(path).data.publicUrl;
  const table=isTrack?'track_tasks':'task_templates';
  const {error}=await sb.from(table).update({media_url:url}).eq('id',id);
  if(error){ toast("保存失败："+error.message); return; }
  toast("加好了 ✓ 学生就能听/看到了");
  refreshTaskViews();
}
async function removeMedia(id,isTrack){
  if(!confirm("移除这条作业的语音/图片？")) return;
  const table=isTrack?'track_tasks':'task_templates';
  const {error}=await sb.from(table).update({media_url:null}).eq('id',id);
  if(error){ toast("失败："+error.message); return; }
  toast("已移除"); refreshTaskViews();
}
function refreshTaskViews(){
  const p=document.querySelector('.panel.active'); if(!p) return;
  if(p.id==='panel-students' && selectedStuId){
    const s=STUDENTS.find(x=>x.id===selectedStuId); if(s) renderStudentHomework(s);
  } else if(p.id==='panel-tasks'){ renderTasksTab(); }
}
async function saveTask(id,isTrack){
  const payload={
    title:document.getElementById('t_title_'+id).value.trim(),
    type:document.getElementById('t_type_'+id).value,
    description:document.getElementById('t_desc_'+id).value.trim(),
    example:document.getElementById('t_ex_'+id).value.trim()||null,
    pinyin:document.getElementById('t_py_'+id).value.trim()||null
  };
  if(isTrack){ const act=document.getElementById('t_act_'+id); if(act) payload.active=act.checked; }
  const table=isTrack?'track_tasks':'task_templates';
  const {error}=await sb.from(table).update(payload).eq('id',id);
  if(error){toast("保存失败："+error.message);return;}
  toast("已保存 ✓");
}

/* ---------- 启动：已登录就直接进 ---------- */
(async()=>{
  const {data:{session}}=await sb.auth.getSession();
  if(session) enterApp();
})();
</script>
