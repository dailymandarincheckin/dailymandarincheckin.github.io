<!DOCTYPE html>
<html lang="zh" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蔡老师 · 中文每日打卡</title>
<style>
/* ============================================================
   中文打卡系统 · 学生端「甲 · 暖纸手绘」
   骨架 = 周条 + 对话流 + 分步引导（分步只在录音题出现）
   ------------------------------------------------------------
   · 单文件 / CSS 全内联 / 零外部资源（不引 CDN 字体、不引图标库）
   · 图标一律内联 SVG sprite，跟着 currentColor 走
   · 圆角 12–18px，无直角；陶土色一屏最多一块
   ============================================================ */

/* ---------- 1. 颜色变量 ---------- */
:root{
  --paper:#f7f0e4;        /* 页面底色 · 米色纸感 */
  --card:#fdf9f0;         /* 卡片/气泡底色 */
  --card-hi:#fffdf8;
  --mine:#f3e8d5;         /* 「我的回答」气泡 */
  --mine-hi:#f8efe0;
  --ink:#4a3c2c;          /* 主文字 · 暖褐 */
  --ink2:#7d6a55;         /* 次要文字 */
  --ink3:#a89680;         /* 英文 / 拼音 / 最弱信息 */
  --line:#e5dac7;
  --line-soft:#eee4d4;

  /* 唯一强调色 · 陶土棕 */
  --clay:#a8683f;
  --clay-hi:#b87b50;
  --clay-lo:#9a5c35;
  --clay-soft:#e8d3c2;
  --ring:rgba(168,104,63,.16);
  /* 压在陶土色上的文字。深色模式下陶土会变浅，白字就看不清了 */
  --on-clay:#fff;
  --on-clay-soft:rgba(255,255,255,.8);

  /* 状态色 · 淡水彩块 */
  --peach:#f0d5c4;   --peach-hi:#f7e2d5;
  --moss:#d6e0cd;    --moss-hi:#e2eade;
  --sky:#cfdde6;     --sky-hi:#dde8ef;
  --sand:#efe0c4;    --sand-hi:#f6ead6;
  --moss-ink:#5a6b50;
  --sky-ink:#4c6473;
  --peach-ink:#8e5a41;

  --grain:rgba(168,150,128,.035);
  --grain2:rgba(168,150,128,.028);
  --wash:rgba(255,253,246,.7);
  --edge:rgba(255,255,255,.72);
  --edge-in:rgba(120,98,72,.05);
  --shadow:0 1px 1px rgba(74,60,44,.028), 0 6px 16px -12px rgba(74,60,44,.24);
  --shadow-lift:0 2px 3px rgba(74,60,44,.035), 0 16px 34px -20px rgba(74,60,44,.34);
  --shadow-clay:0 1px 1px rgba(90,50,24,.12), 0 8px 16px -10px rgba(150,88,50,.55);

  --r-sm:12px; --r-md:14px; --r-lg:16px; --r-xl:18px; --r-pill:999px;
}
/* 深色模式：系统偏好 + 手动切换，双向都能覆盖 */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#211b15; --card:#2c251d; --card-hi:#332b22;
    --mine:#3a301f; --mine-hi:#413625;
    --ink:#eee4d3; --ink2:#c1b09a; --ink3:#8f8172;
    --line:#3e3428; --line-soft:#372e24;
    --clay:#d69465; --clay-hi:#e0a276; --clay-lo:#c88558;
    --clay-soft:#4a382c; --ring:rgba(214,148,101,.2);
    --on-clay:#2a2118; --on-clay-soft:rgba(42,33,24,.72);
    --peach:#5d4436;  --peach-hi:#6a5040;
    --moss:#3f4c3a;   --moss-hi:#4a5844;
    --sky:#374751;    --sky-hi:#41535e;
    --sand:#55462d;   --sand-hi:#615137;
    --moss-ink:#c3d2b8; --sky-ink:#bcd2de; --peach-ink:#e8c0a6;
    --grain:rgba(255,240,220,.022); --grain2:rgba(255,240,220,.016);
    --wash:rgba(255,232,200,.04);
    --edge:rgba(255,240,220,.055);
    --edge-in:rgba(0,0,0,.18);
    --shadow:0 1px 2px rgba(0,0,0,.2);
    --shadow-lift:0 12px 30px -18px rgba(0,0,0,.6);
    --shadow-clay:0 6px 14px -10px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --paper:#211b15; --card:#2c251d; --card-hi:#332b22;
  --mine:#3a301f; --mine-hi:#413625;
  --ink:#eee4d3; --ink2:#c1b09a; --ink3:#8f8172;
  --line:#3e3428; --line-soft:#372e24;
  --clay:#d69465; --clay-hi:#e0a276; --clay-lo:#c88558;
  --clay-soft:#4a382c; --ring:rgba(214,148,101,.2);
  --on-clay:#2a2118; --on-clay-soft:rgba(42,33,24,.72);
  --peach:#5d4436;  --peach-hi:#6a5040;
  --moss:#3f4c3a;   --moss-hi:#4a5844;
  --sky:#374751;    --sky-hi:#41535e;
  --sand:#55462d;   --sand-hi:#615137;
  --moss-ink:#c3d2b8; --sky-ink:#bcd2de; --peach-ink:#e8c0a6;
  --grain:rgba(255,240,220,.022); --grain2:rgba(255,240,220,.016);
  --wash:rgba(255,232,200,.04);
  --edge:rgba(255,240,220,.055);
  --edge-in:rgba(0,0,0,.18);
  --shadow:0 1px 2px rgba(0,0,0,.2);
  --shadow-lift:0 12px 30px -18px rgba(0,0,0,.6);
  --shadow-clay:0 6px 14px -10px rgba(0,0,0,.6);
}

/* ---------- 2. 字体 ---------- */
/* 圆体只有 Mac / iOS 自带，安卓和 Windows 会 fallback，所以字体栈要写完整。
   不引 Google Fonts —— 外链字体在受限网络会加载失败，而且慢。 */
:root{
  --font-cn:"Yuanti SC","STYuanti","Hiragino Sans GB","PingFang SC",
            "Microsoft YaHei",system-ui,-apple-system,sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--font-cn);
  background:var(--paper);
  color:var(--ink);
  line-height:1.9;
  letter-spacing:.3px;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  /* 纸的质感：页顶一层柔光 + 两层错位的细颗粒，纯 CSS，不用图片 */
  background-image:
    radial-gradient(120% 70% at 50% -12%, var(--wash), transparent 62%),
    radial-gradient(var(--grain) .6px, transparent .9px),
    radial-gradient(var(--grain2) .5px, transparent .8px);
  background-size:100% 720px, 5px 5px, 7px 7px;
  background-position:0 0, 0 0, 2px 3px;
  background-repeat:no-repeat, repeat, repeat;
  background-attachment:fixed, scroll, scroll;
  overflow-x:hidden;
}
button,textarea{font-family:inherit}

/* 英文一律浅、细、小 —— 中文在前，英文在后 */
.eng{
  display:block;font-size:.85em;color:var(--ink3);
  font-weight:400;letter-spacing:.2px;line-height:1.5;
}
.eng-i{display:inline;font-size:.85em;color:var(--ink3);margin-left:6px}

/* 内联 SVG 图标：跟着 currentColor 走，不会在暖色页面上冒出一块蓝或绿 */
.gi{width:1em;height:1em;display:block;flex:none;color:inherit}

:focus-visible{outline:2px solid var(--clay);outline-offset:2px;border-radius:var(--r-sm)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}

.wrap{max-width:560px;margin:0 auto;padding:26px 18px 96px}

/* ---------- 3. 加载页 / 出错页 ---------- */
#gateView{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.gatecard{
  background:linear-gradient(180deg,var(--card-hi),var(--card));
  border-radius:var(--r-xl);padding:38px 26px;text-align:center;max-width:400px;
  box-shadow:inset 0 0 0 1px var(--line-soft),inset 0 1px 0 var(--edge),var(--shadow);
}
.gatecard .art{width:104px;margin:0 auto 18px;color:var(--ink3);opacity:.75;position:relative;padding:8px}
.gatecard .art::before{
  content:"";position:absolute;inset:-16px -10px -8px;
  background:radial-gradient(58% 54% at 50% 48%, var(--sand), transparent 72%);
  opacity:.55;border-radius:50%;
}
.gatecard .art svg{width:100%;height:auto;display:block;position:relative}
.gatecard h1{font-size:17px;font-weight:600;letter-spacing:1.2px;line-height:1.7}
.gatecard p{font-size:13px;color:var(--ink2);margin-top:9px;line-height:1.85}
.gatecard .eng{margin-top:4px}
.spinner{
  width:32px;height:32px;margin:0 auto 20px;border-radius:50%;
  border:2.5px solid var(--line);border-top-color:var(--clay);
  animation:spin .95s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- 4. 页头 ---------- */
#appView{display:none}
.masthead{display:flex;align-items:center;gap:11px;margin-bottom:20px}
.masthead .who{font-size:14.5px;color:var(--ink2);flex:1;line-height:1.7}
.masthead .who b{color:var(--ink);font-weight:600;letter-spacing:.5px}
/* 页头右上角一枝手绘小草，只做情绪，不承担功能 */
.masthead .sprig{width:34px;color:var(--clay);opacity:.32;flex:none}
.masthead .sprig svg{width:100%;height:auto;display:block}

/* ---------- 5. 周条（顶部七格，一眼看完整周） ---------- */
.weekbar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:10px}
.wd{
  border-radius:var(--r-sm);padding:8px 0 7px;text-align:center;
  border:1.5px solid transparent;
  background:linear-gradient(180deg,var(--card-hi),var(--card));
  box-shadow:inset 0 0 0 1px var(--line-soft),inset 0 1px 0 var(--edge);
  font-size:11px;color:var(--ink3);line-height:1.35;letter-spacing:0;
}
.wd .d{font-size:12.5px;color:var(--ink2);display:block}
/* 星期几的英文缩写：一二三对非母语学生不直观，Mon/Tue 是真正的认读拐杖 */
.wd .eng{font-size:9px;letter-spacing:.1px;line-height:1.3;opacity:.85}
.wd .m{display:flex;align-items:center;justify-content:center;height:17px;font-size:12.5px;line-height:1;margin-top:1px}
.wd .m .gi{width:12px;height:12px}
.wd.done{background:linear-gradient(180deg,var(--moss-hi),var(--moss));border-color:transparent;box-shadow:inset 0 1px 0 var(--edge)}
.wd.done .d,.wd.done .m{color:var(--moss-ink)}
.wd.done .eng{color:var(--moss-ink);opacity:.6}
/* 今天，还没交 —— 桃色 ＋ 圆点 */
.wd.today{
  background:linear-gradient(180deg,var(--peach-hi),var(--peach));border-color:transparent;
  box-shadow:inset 0 1px 0 var(--edge),0 4px 10px -7px rgba(142,90,65,.5);
}
.wd.today .d{color:var(--peach-ink);font-weight:600}
.wd.today .m{color:var(--peach-ink)}
.wd.today .eng{color:var(--peach-ink);opacity:.7}
/* 还没交的今天，那颗 ● 轻轻呼吸一下 —— 唯一会动的地方 */
.wd.today:not(.done) .m{animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.45}}
/* 今天，已经交了 —— 桃色 ＋ ✓ */
.wd.today.done{background:linear-gradient(180deg,var(--peach-hi),var(--peach));border-color:transparent}
.wd.today.done .d,.wd.today.done .m{color:var(--peach-ink)}
.wd.today.done .eng{color:var(--peach-ink);opacity:.7}
.wd.future .d{color:var(--ink3)}
.wd.rest{background:none;box-shadow:none;border:1.5px dashed var(--line)}
.wd.rest .d{color:var(--ink3);opacity:.65}
.wd.today.rest{background:none;box-shadow:none;border:1.5px dashed var(--peach-ink)}
.wd.today.rest .d{color:var(--peach-ink);opacity:1}
.wd.today.rest .eng{color:var(--peach-ink);opacity:.7}
.wd.today.rest .m{color:var(--peach-ink);opacity:.8;animation:none}
.weekhint{text-align:center;font-size:11.5px;color:var(--ink3);margin-bottom:26px;letter-spacing:0}

/* ---------- 6. 对话流 ---------- */
#taskArea{display:flex;flex-direction:column;gap:30px}
.daygroup{display:flex;flex-direction:column}
.flow{display:flex;flex-direction:column;gap:18px}

.turn{display:flex;gap:10px;align-items:flex-start}
.turn.me{flex-direction:row-reverse}

.ava{
  flex:none;width:34px;height:34px;border-radius:var(--r-sm);
  background:linear-gradient(180deg,var(--card-hi),var(--card));
  box-shadow:inset 0 0 0 1px var(--line-soft),inset 0 1px 0 var(--edge),var(--shadow);
  display:flex;align-items:center;justify-content:center;margin-top:3px;
}
.ava svg{width:22px;height:22px;display:block;color:var(--ink2)}
.ava.me{background:linear-gradient(180deg,var(--clay-soft),var(--clay-soft));box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.ava.me svg{color:var(--clay)}

.bubblewrap{flex:1;min-width:0}
.turn.me .bubblewrap{display:flex;flex-direction:column;align-items:flex-end}

.speaker{
  font-size:11.5px;color:var(--ink3);margin:0 5px 6px;letter-spacing:.2px;
  display:flex;align-items:center;gap:7px;flex-wrap:wrap;
}
.turn.me .speaker{justify-content:flex-end}
.speaker .day{color:var(--ink2)}
.speaker .glyph{width:15px;height:15px;color:var(--clay);opacity:.7}
.speaker .glyph svg{width:100%;height:100%;display:block}

/* 气泡：靠不对称圆角做尾巴 —— 朝向头像的那一角收成很小的圆角，其余三角大圆 */
.bubble{
  background:linear-gradient(180deg,var(--card-hi),var(--card));
  border-radius:4px 20px 20px 20px;padding:16px 18px;
  box-shadow:inset 0 0 0 1px var(--line-soft),inset 0 1px 0 var(--edge),var(--shadow);
}
.turn.me .bubble{
  background:linear-gradient(180deg,var(--mine-hi),var(--mine));
  border-radius:20px 4px 20px 20px;display:inline-block;max-width:100%;
}
.turn.me .bubble.full{width:100%}

.t-title{font-size:17.5px;font-weight:600;letter-spacing:1.4px;line-height:1.6}
.t-desc{font-size:14.5px;color:var(--ink2);margin-top:8px;line-height:1.9;white-space:pre-line}

/* 题目正文的拼音。
   纯口语学生（.only）看到的就是这一份，所以要跟正文一样醒目；
   其余情况是辅助，浅一点、斜体。 */
.t-py{font-size:13.5px;color:var(--ink2);font-style:italic;line-height:1.85;margin-top:6px;letter-spacing:.3px;white-space:pre-line}
.t-py.only{font-style:normal;font-size:14.5px;color:var(--ink2);margin-top:0}
/* HSK3 以上的读题：拼音默认收起，点一下才看。
   让汉字成为默认路径，拼音成为求助路径 —— 防止「拼音依赖」。 */
details.pyfold{margin-top:9px}
details.pyfold>summary{
  list-style:none;cursor:pointer;font-size:12px;color:var(--ink3);letter-spacing:.2px;
  display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:var(--r-pill);
  box-shadow:inset 0 0 0 1px var(--line-soft);transition:color .18s ease,box-shadow .18s ease;
}
details.pyfold>summary::-webkit-details-marker{display:none}
details.pyfold>summary::marker{content:""}
details.pyfold>summary:hover{color:var(--clay);box-shadow:inset 0 0 0 1px var(--clay)}
details.pyfold[open]>summary{margin-bottom:2px}

/* 例句 —— 做成压进纸里的一小块，跟气泡区分开 */
.t-ex{
  margin-top:14px;background:var(--paper);border-radius:var(--r-md);padding:12px 14px;
  box-shadow:inset 0 0 0 1px var(--line-soft),inset 0 1px 2px var(--edge-in);
}
.t-ex .lbl{font-size:11px;color:var(--ink3);letter-spacing:.5px;margin-bottom:4px}
.t-ex .ex-zh{font-size:14.5px;color:var(--ink);letter-spacing:.6px;line-height:1.85}
.t-ex .ex-py{font-size:11.5px;color:var(--ink3);font-style:italic;margin-top:2px;line-height:1.6}

/* 「这题我看不懂」—— 故意做得很轻，不能跟「提交打卡」抢注意力 */
.hardrow{display:flex;justify-content:center;margin-top:10px}
.hardbtn{
  background:none;border:none;cursor:pointer;padding:6px 10px;
  font-family:inherit;font-size:12.5px;color:var(--ink3);letter-spacing:.4px;
  display:flex;align-items:center;gap:7px;border-radius:var(--r-sm);
}
.hardbtn:hover{color:var(--clay)}
.hardbtn .eng{font-size:11px}
.hardbtn.sent{color:var(--bamboo);cursor:default}

/* 「跟我念」—— 跟读／朗读题要念的内容。
   跟例句（.t-ex 压进纸里）分开：这一块是【任务本身】，所以浮起来、用沙色、字更大。 */
.t-say{
  margin-top:14px;border-radius:var(--r-md);padding:13px 15px;
  background:linear-gradient(180deg,var(--sand-hi),var(--sand));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5);
}
.t-say .lbl{
  font-size:11px;color:#8a6f45;letter-spacing:.8px;margin-bottom:8px;font-weight:600;
  /* 必须 flex：icon() 生成的 svg 带 .gi（display:block），不 flex 会自己占一行把标签挤断 */
  display:flex;align-items:center;gap:6px;
}
/* lines：句子竖排，带编号 */
.t-say .line{display:flex;gap:9px;align-items:flex-start;margin-bottom:9px}
.t-say .line:last-child{margin-bottom:0}
.t-say .no{
  flex:0 0 19px;height:19px;border-radius:50%;margin-top:3px;
  background:rgba(255,255,255,.75);color:#8a6f45;
  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;
}
.t-say .zh{font-size:16px;color:var(--ink);letter-spacing:.8px;line-height:1.7}
.t-say .py{font-size:12px;color:#8a6f45;font-style:italic;line-height:1.5;margin-top:1px}
/* words：词语横排小卡 */
.t-say .words{display:flex;flex-wrap:wrap;gap:8px}
.t-say .w{
  background:rgba(255,255,255,.72);border-radius:12px;padding:8px 14px;text-align:center;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.8);
}
.t-say .w .wz{font-size:16.5px;color:var(--ink);letter-spacing:1px;line-height:1.5}
.t-say .w .wp{font-size:11.5px;color:#8a6f45;font-style:italic;line-height:1.4}

.typetag{
  flex:none;display:inline-flex;align-items:center;gap:5px;
  font-size:10.5px;letter-spacing:.2px;padding:3px 10px 3px 8px;border-radius:var(--r-pill);
  background:linear-gradient(180deg,var(--sand-hi),var(--sand));
  color:var(--ink2);line-height:1.7;box-shadow:inset 0 1px 0 var(--edge);
}
.typetag .gi{width:11px;height:11px}
.typetag .eng-i{margin-left:2px}
.typetag.type-rec{background:linear-gradient(180deg,var(--peach-hi),var(--peach));color:var(--peach-ink)}
.typetag.type-rec .eng-i{color:var(--peach-ink);opacity:.72}
.typetag.type-txt{background:linear-gradient(180deg,var(--sky-hi),var(--sky));color:var(--sky-ink)}
.typetag.type-txt .eng-i{color:var(--sky-ink);opacity:.72}

/* ---------- 7. 老师的语音（大喇叭 + 波形） ---------- */
.playbtn{
  width:100%;margin-top:14px;display:flex;align-items:center;gap:13px;
  background:linear-gradient(180deg,var(--peach-hi),var(--peach));
  border:none;border-radius:var(--r-lg);padding:13px 15px;
  cursor:pointer;text-align:left;color:var(--peach-ink);
  box-shadow:inset 0 1px 0 var(--edge),0 4px 12px -9px rgba(142,90,65,.6);
  transition:transform .16s ease,box-shadow .16s ease;
}
.playbtn:hover{transform:translateY(-1px)}
.playbtn:active{transform:translateY(1px);box-shadow:inset 0 2px 4px var(--edge-in)}
.playbtn .ic{
  flex:none;width:36px;height:36px;border-radius:var(--r-sm);
  background:rgba(255,255,255,.52);display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6);
}
.playbtn .ic .gi{width:17px;height:17px}
.playbtn .lab{flex:1;min-width:0}
.playbtn .lab b{font-size:14.5px;font-weight:600;display:block;letter-spacing:.8px}
.playbtn .lab .eng{color:var(--peach-ink);opacity:.68}
.playbtn.playing{background:linear-gradient(180deg,var(--clay-soft),var(--clay-soft))}

/* 波形：纯 CSS 小竖条，不用图片 */
.wave{display:flex;align-items:center;gap:2.5px;height:22px;margin-top:11px;padding:0 2px}
.wave i{flex:1;background:var(--peach-ink);opacity:.26;border-radius:var(--r-pill);display:block}

/* 老师的图片 */
.t-img{
  margin-top:14px;border-radius:var(--r-lg);overflow:hidden;background:var(--paper);
  box-shadow:inset 0 0 0 1px var(--line-soft);
}
.t-img .lbl{
  font-size:11px;color:var(--ink3);padding:9px 13px 7px;letter-spacing:.4px;
  display:flex;align-items:center;gap:6px;
}
.t-img .lbl .gi{width:12px;height:12px}
.t-img img{display:block;width:100%;height:auto}
.filelink{
  margin-top:14px;display:inline-flex;align-items:center;gap:8px;
  background:linear-gradient(180deg,var(--sand-hi),var(--sand));color:var(--ink2);
  border-radius:var(--r-md);padding:10px 15px;font-size:13.5px;text-decoration:none;
  box-shadow:inset 0 1px 0 var(--edge);letter-spacing:.2px;
}
.filelink .gi{width:14px;height:14px}

/* ---------- 8. 分步引导（只在录音题出现） ---------- */
.steps{display:flex;align-items:center;margin:4px 6px 0;padding:0 10px}
.step{display:flex;align-items:center;gap:7px;font-size:11.5px;letter-spacing:.4px}
.step .txt{display:flex;flex-direction:column;line-height:1.4;color:var(--ink3)}
.step .txt .eng{font-size:9.5px;letter-spacing:.1px;line-height:1.3}
.step .bead{
  width:20px;height:20px;border-radius:var(--r-pill);flex:none;
  display:flex;align-items:center;justify-content:center;font-size:10.5px;
  background:linear-gradient(180deg,var(--card-hi),var(--card));
  box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink3);line-height:1;
}
.step.done .bead{
  background:linear-gradient(180deg,var(--moss-hi),var(--moss));
  box-shadow:inset 0 1px 0 var(--edge);color:var(--moss-ink);
}
.step.done .txt{color:var(--ink2)}
.step.now .bead{
  background:linear-gradient(180deg,var(--clay-hi),var(--clay));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 0 0 4px var(--ring);
  color:var(--on-clay);
}
.step.now .txt{color:var(--clay);font-weight:600}
.steprail{flex:1;height:2px;background:var(--line);margin:0 8px;border-radius:var(--r-pill)}
.steprail.filled{background:var(--moss)}

/* ---------- 9. 我的回答区 ---------- */
.recbtn{
  width:100%;border:none;border-radius:var(--r-lg);padding:15px 18px;cursor:pointer;
  background:linear-gradient(180deg,var(--clay-hi),var(--clay) 58%,var(--clay-lo));
  color:var(--on-clay);text-align:center;font-size:15.5px;letter-spacing:.8px;line-height:1.6;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.24),var(--shadow-clay);
  transition:transform .16s ease,box-shadow .16s ease;
  display:flex;flex-direction:column;align-items:center;
}
.recbtn>span:first-child{display:flex;align-items:center;justify-content:center;gap:8px}
.recbtn:hover{transform:translateY(-1px)}
.recbtn:active{transform:translateY(1px);box-shadow:inset 0 2px 5px rgba(90,50,24,.28)}
.recbtn .eng{color:var(--on-clay-soft)}
.recbtn.warm{
  background:linear-gradient(180deg,var(--sand-hi),var(--sand));color:var(--ink2);
  box-shadow:inset 0 1px 0 var(--edge),var(--shadow);
}
.recbtn.warm .eng{color:var(--ink3)}
.recbtn.on{
  background:linear-gradient(180deg,var(--peach-hi),var(--peach));color:var(--peach-ink);
  box-shadow:inset 0 1px 0 var(--edge),0 0 0 4px var(--ring);
}
.recbtn.on .eng{color:var(--peach-ink);opacity:.7}
.recbtn.mine{
  background:linear-gradient(180deg,var(--moss-hi),var(--moss));color:var(--moss-ink);
  box-shadow:inset 0 1px 0 var(--edge),var(--shadow);
}
.recbtn.mine .eng{color:var(--moss-ink);opacity:.72}

.recdot{
  display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--clay);
  box-shadow:0 0 0 0 var(--ring);animation:pulse 1.4s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{opacity:1;transform:scale(1);box-shadow:0 0 0 0 var(--ring)}
  50%{opacity:.45;transform:scale(.84);box-shadow:0 0 0 6px transparent}
}
.rectime{font-variant-numeric:tabular-nums;letter-spacing:1.4px}

.livewave{display:flex;align-items:flex-end;justify-content:center;gap:3px;height:24px;margin-top:12px}
.livewave i{
  width:3px;height:5px;border-radius:var(--r-pill);background:var(--peach-ink);opacity:.5;
  animation:bounce 1.1s ease-in-out infinite both;
}
@keyframes bounce{0%,100%{height:5px;opacity:.4}50%{height:21px;opacity:.62}}

.recrow{display:flex;gap:8px;margin-top:11px;justify-content:flex-end}
.minibtn{
  display:inline-flex;align-items:center;gap:6px;
  border:1.5px solid var(--line);background:transparent;color:var(--ink2);
  font-size:12.5px;padding:7px 14px;border-radius:var(--r-sm);cursor:pointer;letter-spacing:.2px;
  transition:border-color .18s ease,color .18s ease;
}
.minibtn .gi{width:13px;height:13px}
.minibtn:hover{border-color:var(--clay);color:var(--clay)}

.answer{
  width:100%;min-height:104px;border:none;border-radius:var(--r-lg);padding:14px 16px;
  font-size:15px;line-height:1.9;background:var(--card);color:var(--ink);
  resize:vertical;letter-spacing:.3px;
  box-shadow:inset 0 0 0 1px var(--line),inset 0 2px 4px var(--edge-in);
  transition:box-shadow .18s ease;
}
.answer::placeholder{color:var(--ink3)}
.answer:focus{outline:none;box-shadow:inset 0 0 0 1.5px var(--clay),0 0 0 4px var(--ring)}

.btn{
  width:100%;margin-top:12px;border:none;border-radius:var(--r-lg);padding:14px;
  background:linear-gradient(180deg,var(--clay-hi),var(--clay) 58%,var(--clay-lo));
  color:var(--on-clay);font-size:15.5px;letter-spacing:.8px;cursor:pointer;line-height:1.55;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.24),var(--shadow-clay);
  transition:transform .16s ease,box-shadow .16s ease;
}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(1px);box-shadow:inset 0 2px 5px rgba(90,50,24,.28)}
.btn .eng{color:var(--on-clay-soft)}
.btn:disabled{opacity:.6;transform:none;cursor:default}
/* 还没东西可交时，提交按钮先「淡着」——避免一屏出现两块大陶土 */
.btn.ghost{background:none;border:1.5px dashed var(--line);color:var(--ink3);box-shadow:none}
.btn.ghost:hover,.btn.ghost:active{transform:none;box-shadow:none}
.btn.ghost .eng{color:var(--ink3);opacity:.75}

.orfile{text-align:center;font-size:12px;color:var(--ink3);margin-top:13px;letter-spacing:.2px;line-height:1.8}
.orfile label,.orfile a{
  color:var(--ink2);cursor:pointer;border-bottom:1px solid var(--line);padding-bottom:1px;
  transition:color .18s ease,border-color .18s ease;
}
.orfile label:hover,.orfile a:hover{color:var(--clay);border-color:var(--clay)}
.fileName{font-size:12px;color:var(--ink2);margin-top:10px;text-align:center;line-height:1.7;letter-spacing:.2px}
/* 页面内相机（2026-08-09）。
   为什么不用手机自己的相机：安卓叫出相机 App 时 Chrome 会退到后台，内存紧张就被杀掉，
   照片带不回来（Ming Hong 和 Ming Xuan 两台手机都这样）。在页面里开相机就不会离开 Chrome。 */
.camwrap{margin-top:12px;display:none}
.camwrap.show{display:block}
.camstage{
  position:relative;width:100%;aspect-ratio:3/4;max-height:58vh;overflow:hidden;
  border-radius:var(--r-lg);background:var(--ink);
  box-shadow:inset 0 0 0 1px var(--line-soft);
}
.camstage video,.camstage img{width:100%;height:100%;object-fit:cover;display:block}
.camrow{display:flex;gap:9px;margin-top:11px}
.camrow .btn{flex:1;margin:0}
.camhint{font-size:12px;color:var(--ink3);text-align:center;margin-top:9px;line-height:1.8;letter-spacing:.2px}
.shot{margin-top:12px;display:none}
.shot.show{display:block}
.shot img{width:100%;border-radius:var(--r-lg);display:block;box-shadow:inset 0 0 0 1px var(--line-soft)}
/* 上传失败时的详细原因。以前只弹一个「上传失败」就没了，老师根本查不到为什么。
   这块会一直留在页面上，学生可以直接截图给老师。 */
.uperr{
  display:none;margin-top:10px;padding:10px 12px;border-radius:var(--r-md);
  background:var(--card-hi);box-shadow:inset 0 0 0 1px var(--line-soft);
  font-size:12px;color:var(--ink2);line-height:1.75;letter-spacing:.2px;text-align:left;
}
.uperr.show{display:block}
.uperr .why{font-size:11px;color:var(--ink3);word-break:break-all;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;margin-top:6px;user-select:all}

/* 我交上去的东西 */
.myfile{display:flex;align-items:center;gap:11px;font-size:14px;color:var(--ink2)}
.myfile .ic{
  flex:none;width:32px;height:32px;border-radius:var(--r-sm);
  background:linear-gradient(180deg,var(--sand-hi),var(--sand));
  display:flex;align-items:center;justify-content:center;color:var(--ink2);
  box-shadow:inset 0 1px 0 var(--edge);
}
.myfile .ic .gi{width:16px;height:16px}
.mytext{font-size:15px;color:var(--ink);line-height:1.9;letter-spacing:.2px}

/* ---------- 10. 老师评语气泡（斜体 + 印章） ---------- */
.bubble.fb{background:linear-gradient(180deg,var(--card-hi),var(--card))}
.fbtext{font-style:italic;font-size:15px;color:var(--ink);line-height:1.95;letter-spacing:.6px;white-space:pre-wrap}
/* 印章用 float，文字只在挨着它的那几行绕开，下面的行照样铺满 */
.seal{
  float:right;margin:2px 0 8px 13px;width:40px;height:40px;border-radius:var(--r-sm);
  color:var(--clay);position:relative;box-shadow:inset 0 0 0 1.6px var(--clay);
  display:flex;align-items:center;justify-content:center;
  font-size:19px;transform:rotate(-7deg);opacity:.8;line-height:1;
}
/* 里面再描一圈细线，像真的印章 */
.seal::after{content:"";position:absolute;inset:3.5px;border-radius:8px;box-shadow:inset 0 0 0 .8px currentColor;opacity:.45}
.fbdate{font-size:11px;color:var(--ink3);margin-top:11px;letter-spacing:.2px;clear:both}

.status{
  display:inline-flex;align-items:center;gap:8px;font-size:13px;
  padding:9px 16px;border-radius:var(--r-pill);letter-spacing:.2px;
  box-shadow:inset 0 1px 0 var(--edge);
}
.status .gi{width:14px;height:14px}
.status.wait{background:linear-gradient(180deg,var(--sand-hi),var(--sand));color:var(--ink2)}
.status.ok{background:linear-gradient(180deg,var(--moss-hi),var(--moss));color:var(--moss-ink)}
.status.ok .eng{color:var(--moss-ink);opacity:.72}
.status .eng{display:inline;font-size:.85em;margin-left:4px}

.donebar{
  display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--moss-ink);
  background:linear-gradient(180deg,var(--moss-hi),var(--moss));
  border-radius:var(--r-md);padding:11px 15px;letter-spacing:.2px;margin-top:18px;
  box-shadow:inset 0 1px 0 var(--edge);
}
.donebar svg{width:17px;height:17px;flex:none}
.undo{
  display:block;margin:12px auto 0;border:none;background:transparent;color:var(--ink3);
  font-size:12px;cursor:pointer;letter-spacing:.2px;padding:4px 10px;border-radius:var(--r-sm);
  transition:color .18s ease;
}
.undo:hover{color:var(--clay)}

/* ---------- 11. 查看前几天 / 明日预告 / 页尾 ---------- */
.pastbtn{
  margin-top:24px;font-size:13px;color:var(--ink2);
  border:1.5px dashed var(--line);border-radius:var(--r-md);padding:12px;cursor:pointer;
  letter-spacing:.2px;line-height:1.7;display:flex;flex-direction:column;align-items:center;
  transition:border-color .18s ease,color .18s ease;
}
.pastbtn>span:first-child{display:flex;align-items:center;gap:7px}
.pastbtn .gi{width:13px;height:13px}
.pastbtn:hover{border-color:var(--clay);color:var(--clay)}
.pastbtn.open .gi{transform:rotate(180deg)}
.peek{
  margin-top:14px;font-size:13px;color:var(--ink2);
  background:linear-gradient(180deg,var(--card-hi),var(--card));
  border-radius:var(--r-md);padding:14px;letter-spacing:.2px;line-height:1.7;
  box-shadow:inset 0 0 0 1px var(--line-soft),inset 0 1px 0 var(--edge);
  display:flex;flex-direction:column;align-items:center;text-align:center;
}
.peek>span:first-child{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:center}
.peek .gi{width:14px;height:14px;color:var(--clay);opacity:.6}
.peek b{color:var(--ink3);letter-spacing:3px}

.restcard{
  background:linear-gradient(180deg,var(--card-hi),var(--card));border-radius:var(--r-xl);
  padding:38px 26px;text-align:center;
  box-shadow:inset 0 0 0 1px var(--line-soft),inset 0 1px 0 var(--edge),var(--shadow);
}
.restcard .art{width:104px;margin:0 auto 18px;color:var(--ink3);opacity:.75;position:relative;padding:8px}
.restcard .art::before{
  content:"";position:absolute;inset:-16px -10px -8px;
  background:radial-gradient(58% 54% at 50% 48%, var(--sand), transparent 72%);
  opacity:.55;border-radius:50%;
}
.restcard .art svg{width:100%;height:auto;display:block;position:relative}
.restcard h3{font-size:17px;font-weight:600;letter-spacing:1.2px;line-height:1.7}
.restcard p{font-size:13px;color:var(--ink2);margin-top:9px;line-height:1.85}

.colophon{margin-top:36px;padding-top:26px;border-top:1px solid var(--line-soft);text-align:center}
.colophon .art{margin:0 auto 14px;width:78px;color:var(--ink3);opacity:.5}
.colophon .art svg{width:100%;height:auto;display:block}
.colophon .pzh{font-size:14.5px;color:var(--ink2);letter-spacing:1.6px;line-height:1.85}
.colophon .ppy{font-size:11.5px;color:var(--ink3);font-style:italic;margin-top:4px;line-height:1.6}
.colophon .pen{font-size:11.5px;color:var(--ink3);margin-top:2px;line-height:1.6}

/* ---------- 12. 庆祝弹窗 ---------- */
/* 这一屏是学生最开心的一刻，所以把陶土色整个让出去，
   全屏只用四块水彩：沙底 ＋ 桃光晕 ＋ 苔绿彩屑 ＋ 桃色按钮 */
#celebrate{
  position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;
  padding:24px;background:rgba(120,84,58,.28);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
}
:root[data-theme="dark"] #celebrate{background:rgba(16,12,8,.55)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #celebrate{background:rgba(16,12,8,.55)}}
#celebrate.show{display:flex;animation:fadeBg .3s ease}
@keyframes fadeBg{from{opacity:0}to{opacity:1}}
.celecard{
  background:
    radial-gradient(130% 66% at 50% 0%, var(--peach-hi), transparent 72%),
    linear-gradient(180deg,var(--sand-hi),var(--card) 62%);
  border-radius:22px;padding:34px 28px 30px;text-align:center;
  width:100%;max-width:320px;position:relative;
  box-shadow:inset 0 0 0 1.5px var(--sand),inset 0 1px 0 var(--edge),var(--shadow-lift);
  animation:popIn .5s cubic-bezier(.2,1.4,.35,1);
}
@keyframes popIn{0%{opacity:0;transform:scale(.86) translateY(18px)}100%{opacity:1;transform:none}}
.celeseal{
  width:84px;height:84px;margin:0 auto 18px;border-radius:24px;
  color:var(--peach-ink);position:relative;box-shadow:inset 0 0 0 2px currentColor;
  display:flex;align-items:center;justify-content:center;
  font-size:42px;transform:rotate(-6deg);line-height:1;
}
.celeseal::after{content:"";position:absolute;inset:6px;border-radius:16px;box-shadow:inset 0 0 0 1px currentColor;opacity:.4}
.celezh{font-size:19px;font-weight:600;letter-spacing:2px;line-height:1.7;color:var(--ink)}
.celeen{font-size:13px;color:var(--ink3);margin-top:4px;line-height:1.6}
/* 连续天数：普通一行字，不做成胶囊。卡片里只能有一个看起来可以点的东西 = 「继续」 */
.streak{
  display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:0 6px;
  margin-top:12px;color:var(--ink2);font-size:12.5px;letter-spacing:.2px;line-height:1.7;
}
.streak .eng-i{margin-left:0}
.streak .gi{width:12px;height:12px;color:var(--peach-ink);opacity:.85}
.cbtn{
  width:100%;margin-top:20px;border:none;border-radius:var(--r-lg);padding:16px;
  background:linear-gradient(180deg,var(--peach-hi),var(--peach));
  color:var(--peach-ink);font-size:16.5px;cursor:pointer;letter-spacing:1px;
  line-height:1.5;font-weight:600;
  box-shadow:inset 0 1px 0 var(--edge),0 6px 14px -10px rgba(142,90,65,.7);
  transition:transform .16s ease;
}
.cbtn:hover{transform:translateY(-1px)}
.cbtn:active{transform:translateY(1px)}
.cbtn .eng{color:var(--peach-ink);opacity:.7}
.confetti{position:fixed;top:-20px;width:8px;height:12px;z-index:1001;pointer-events:none;border-radius:2.5px}

/* ---------- 13. 提示条 ---------- */
.toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(90px);
  background:var(--ink);color:var(--paper);font-size:13.5px;padding:12px 22px;
  border-radius:var(--r-md);letter-spacing:.2px;line-height:1.7;max-width:86vw;text-align:center;
  opacity:0;transition:.3s cubic-bezier(.2,1.3,.4,1);z-index:1100;box-shadow:var(--shadow-lift);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>

/* 调用 Supabase 的一个后端函数 (RPC) */
async function rpc(fn, args){
  const res = await fetch(SUPABASE_URL+"/rest/v1/rpc/"+fn, {
    method:"POST",
    headers:{ "apikey":ANON, "Authorization":"Bearer "+ANON, "Content-Type":"application/json" },
    body: JSON.stringify(args||{})
  });
  const raw = await res.text();
  if(!res.ok){ let m=raw; try{ m=JSON.parse(raw).message||raw; }catch(e){} throw new Error(m); }
  return raw ? JSON.parse(raw) : null;
}

/* 上传一个文件到 Storage 的 uploads 桶，返回公开网址 */
async function uploadFile(file, extOverride){
  const ext = (extOverride || (file.name ? file.name.split('.').pop() : "") || "bin")
    .toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,5) || "bin";
  const path = currentUsername + "/" + Date.now() + "_" + Math.random().toString(36).slice(2,8) + "." + ext;
  const res = await fetch(SUPABASE_URL+"/storage/v1/object/uploads/"+encodeURI(path), {
    method:"POST",
    headers:{ "apikey":ANON, "Authorization":"Bearer "+ANON, "Content-Type": file.type||"application/octet-stream" },
    body: file
  });
  if(!res.ok){ throw new Error(await res.text()); }
  return SUPABASE_URL+"/storage/v1/object/public/uploads/"+encodeURI(path);
}

/* 页头的语录卡已取消，语录和谚语合成一个池子，在页尾轮流出现。

const CHEERS=[

let currentUser="";       // 显示用的名字（display name）
let currentUsername="";   // 登录码（username），存本地进度 + 提交打卡用

/* 小工具：生成一个 sprite 图标 */
function icon(name,cls){ return '<svg class="'+(cls||'gi')+'" aria-hidden="true"><use href="#'+name+'"></use></svg>'; }

function getUserParam(){ return (new URLSearchParams(location.search).get('u')||"").trim(); }

function boot(){
  const u=getUserParam();
  if(!u){ gateError("这个链接缺少名字。","请用老师给你的那条专属链接。","This link is missing a name. Please use the personal link your teacher gave you."); return; }

function sortTasks(arr){
  // 按 MON..SUN 顺序排列
  const map={}; arr.forEach(t=>{ map[(t.day||"").toUpperCase()]=t; });

function todayIdx(){ let d=new Date().getDay(); return (d+6)%7; } // 0=MON..6=SUN
function todayCode(){ return DAYORDER[todayIdx()]; }
function taskMap(){ const m={}; TASKS.forEach(t=>{ m[(t.day||'').toUpperCase()]=t; }); return m; }

/* 用「第几天」来轮换。
   本来用星期几 → 每个星期一都看到同一句，学生会觉得没换。 */
function dayNumber(){
  const d=new Date();
  return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000);
}
/* 页尾：语录和谚语轮流（页头的语录卡已取消） */
function showQuote(){
  const n=dayNumber();
  const s=SAYINGS[((n%SAYINGS.length)+SAYINGS.length)%SAYINGS.length];
  const set=(id,v)=>{const el=document.getElementById(id); if(el) el.textContent=v;};
  set('pZh',s.zh); set('pPy',s.py); set('pEn',s.en);
}

/* 打卡状态：以【服务器】为准，本机记录只是刚提交完的即时反馈。
   （以前只存本机 localStorage，所以手机交的作业电脑上看不到） */
let SERVER_DONE={};
function storeKey(){ return "cai_checkin_"+currentUsername; }
function redoKey(){ return "cai_redo_"+currentUsername; }
function getLocalDone(){ try{return JSON.parse(localStorage.getItem(storeKey())||"{}");}catch(e){return {};} }
function setLocalDone(o){ try{localStorage.setItem(storeKey(),JSON.stringify(o));}catch(e){} }
function getRedo(){ try{return JSON.parse(localStorage.getItem(redoKey())||"{}");}catch(e){return {};} }
function setRedo(o){ try{localStorage.setItem(redoKey(),JSON.stringify(o));}catch(e){} }
/* 合并后的「这天完成了吗」：服务器有 或 本机刚交过；学生选了「再做一次」则不算 */
function getDone(){
  const redo=getRedo(), out={};
  Object.keys(SERVER_DONE||{}).forEach(d=>{ if(!redo[d]) out[d]=true; });
  Object.keys(getLocalDone()).forEach(d=>{ if(!redo[d]) out[d]=true; });
  return out;
}
/* 把老师写的文字安全地放进网页（防止 < > & 之类把版面弄坏） */
function esc(s){return String(s==null?"":s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));}
/* 这天老师的评语（没有就返回空） */
function feedbackOf(day){
  const s=(SERVER_DONE||{})[day];
  return s ? {status:s.status||'pending', comment:(s.comment||'').trim()} : null;
}

/* ===== 周条 ===== */
function renderWeek(){
  const box=document.getElementById('weekArea'); if(!box) return;
  const map=taskMap(), done=getDone(), today=todayCode(), ti=DAYORDER.indexOf(today);
  let cells="", total=0, finished=0;
  DAYORDER.forEach((d,i)=>{
    const hasTask=!!map[d], isDone=!!done[d], isToday=(d===today);
    let cls="wd", mark="";
    if(!hasTask){ cls+=" rest"; }
    else if(isDone){ cls+=" done"; }
    else if(i>ti){ cls+=" future"; }
    if(isToday) cls+=" today";
    if(hasTask){
      total++;
      if(isDone){ finished++; mark="✓"; }
      else if(isToday) mark="●";
    } else if(isToday){
      mark=icon('i-leaf');   // 今天是休息日
    }
    cells+='<div class="'+cls+'"><span class="d">'+DAYSHORT[d]+'</span>'+
           '<span class="eng">'+DAYEN[d]+'</span><span class="m">'+mark+'</span></div>';
  });
  box.innerHTML='<div class="weekbar">'+cells+'</div>'+
    '<div class="weekhint">这周做了 '+finished+' 天 · '+finished+' of '+total+' days done this week</div>';
}

/* ===== 分步引导（只在录音题出现） =====
   有老师语音 → 三步 ①听 ②说 ③交；没有语音 → 两步 ①说 ②交 */
const PLAYED={};   // day -> 学生点过播放没有
function stepsHTML(day,hasAudio,isDone){
  const recorded = !!(REC[day] && REC[day].url) || !!fileStore[day];
  const list=[];
  if(hasAudio) list.push({zh:"听",en:"Listen",done:isDone||!!PLAYED[day]});
  list.push({zh:"说",en:"Speak",done:isDone||recorded});
  list.push({zh:"交",en:"Send",done:isDone});
  // 第一个还没完成的就是「现在这一步」
  let nowIdx=list.findIndex(s=>!s.done);
  let html="";
  list.forEach((s,i)=>{
    if(i>0) html+='<div class="steprail'+(list[i-1].done?' filled':'')+'"></div>';
    const cls = s.done ? "step done" : (i===nowIdx ? "step now" : "step");
    html+='<div class="'+cls+'"><span class="bead">'+(s.done?"✓":(i+1))+'</span>'+
          '<span class="txt">'+s.zh+'<span class="eng">'+s.en+'</span></span></div>';
  });
  return '<div class="steps">'+html+'</div>';
}

/* 题目正文怎么显示（规则见 AUTO_HOMEWORK_DESIGN.md §3.1）
     only = 纯口语学生：只给拼音，一个汉字都不出现
     open = HSK1–2 的读题：汉字和拼音都摆出来
     fold = HSK3 以上的读题：汉字为主，点「看拼音」才展开
     none = 其余情况：只有汉字
   老作业（老师手填的那种）没有这些字段，会走 none，行为跟以前一样。 */
function descHTML(t){
  const mode=t.py_mode||'none';
  const zh=String(t.desc||'').trim();
  const py=String(t.desc_py||'').trim();
  const en=t.desc_en?'<span class="eng">'+esc(t.desc_en)+'</span>':'';
  if(!zh && !py) return '';

  if(mode==='only'){
    // 纯口语学生不认汉字。没标拼音的话宁可整块不显示，
    // 也【绝不能】把汉字塞给他 —— 他看了等于没看。
    if(!py) return '';
    return '<div class="t-desc"><span class="t-py only">'+esc(py)+'</span>'+en+'</div>';
  }

  let html='<div class="t-desc">'+esc(zh)+en;
  if(py && mode==='open'){
    html+='<div class="t-py">'+esc(py)+'</div>';
  } else if(py && mode==='fold'){
    html+='<details class="pyfold"><summary>看拼音 · Show pinyin</summary>'+
          '<div class="t-py">'+esc(py)+'</div></details>';
  }
  return html+'</div>';
}

/* 交完之后，「我交了」气泡里显示学生自己交的东西。
   数据来自 student_login 的 done（V5d 起多回传 file_url / text_answer / type）。
   老数据没有这几个字段，所以最后要有一条兜底。 */
function sentHTML(day, isUpload){
  const s=(SERVER_DONE||{})[day]||{};
  if(s.text_answer){
    return '<div class="mytext">'+esc(s.text_answer)+'</div>';
  }
  if(s.file_url){
    const u=esc(s.file_url), low=String(s.file_url).toLowerCase();
    if(/\.(mp3|m4a|wav|ogg|aac|webm)($|\?)/.test(low)){
      return '<button class="recbtn mine" onclick="playMySent(\''+day+'\')">'+
             '<span>'+icon('i-play')+'<span id="sent_'+day+'">听一下我交的录音</span></span>'+
             '<span class="eng">Play what I sent</span></button>'+
             '<audio id="sa_'+day+'" src="'+u+'" preload="none" onended="sentEnded(\''+day+'\')"></audio>';

/* 「跟我念」块：跟读／朗读题要念的内容。
   两种排版由后台的 say_mode 决定，不靠猜：
     lines = 句子，竖排带 ①②③ 编号
     words = 词语，横排小卡（用「、」分隔）
   拼音（say_pinyin）跟内容一一对应；HSK4 那几道故意留空，防拼音依赖。
   ⚠️ 老题目没有这三个字段（走旧手工作业逻辑的学生也没有）→ 返回空字符串，行为跟以前一样。 */
function sayBlockHTML(t){
  const mode=String(t.say_mode||'').trim(), txt=String(t.say_text||'').trim();
  if(!mode||!txt) return "";
  const py=String(t.say_pinyin||'').trim();
  const lbl='<div class="lbl">'+icon('i-mic','')+' 跟我念 · Read after me</div>';
  if(mode==='words'){

    return '<div class="t-say">'+lbl+'<div class="words">'+
      zs.map((z,i)=>'<div class="w"><div class="wz">'+esc(z.trim())+'</div>'+
        (ps[i]?'<div class="wp">'+esc(ps[i].trim())+'</div>':'')+'</div>').join('')+
      '</div></div>';
  }
  const zs=txt.split('\n').filter(x=>x.trim()), ps=py?py.split('\n'):[];
  return '<div class="t-say">'+lbl+
    zs.map((z,i)=>'<div class="line"><span class="no">'+(i+1)+'</span><div>'+
      '<div class="zh">'+esc(z.trim())+'</div>'+
      (ps[i]&&ps[i].trim()?'<div class="py">'+esc(ps[i].trim())+'</div>':'')+
    '</div></div>').join('')+'</div>';
}

/* 稳妥地播放：第一次点如果还没加载好，自动重载再播一次
   （不这样做的话，第一次点会静静失败，要点三下才响） */
function safePlay(a,onOk,onFail){
  try{
    const p=a.play();
    if(p && p.then){
      p.then(()=>onOk&&onOk()).catch(()=>{
        try{
          a.load();
          const p2=a.play();
          if(p2&&p2.then) p2.then(()=>onOk&&onOk()).catch(()=>onFail&&onFail());
          else onOk&&onOk();
        }catch(e){ onFail&&onFail(); }
      });
    } else { onOk&&onOk(); }
  }catch(e){ onFail&&onFail(); }
}

/* ========== 听老师的语音：大喇叭按钮（三态） ========== */
function setPlayLabel(day,state){
  const lb=document.getElementById('pbl_'+day), ic=document.getElementById('pbi_'+day);
  if(!lb) return;
  if(state==='playing'){
    lb.innerHTML='<b>播放中…</b><span class="eng">Playing · 再点一下停 Tap to stop</span>';
    if(ic) ic.innerHTML=icon('i-pause');
  } else if(state==='again'){
    lb.innerHTML='<b>再听一次</b><span class="eng">Listen again</span>';
    if(ic) ic.innerHTML=icon('i-replay');
  } else {
    lb.innerHTML='<b>点一下听</b><span class="eng">Tap to listen · 可以重复听</span>';
    if(ic) ic.innerHTML=icon('i-speaker');
  }
}
function togglePlay(day){
  const au=document.getElementById('au_'+day), btn=document.getElementById('pb_'+day);
  if(!au||!btn) return;
  // 先停掉别的
  document.querySelectorAll('audio[id^="au_"]').forEach(a=>{ if(a!==au){a.pause();a.currentTime=0;} });
  document.querySelectorAll('.playbtn').forEach(b=>{ if(b!==btn) b.classList.remove('playing'); });
  DAYORDER.forEach(d=>{ if(d!==day && document.getElementById('pbl_'+d)) setPlayLabel(d,'idle'); });
  if(au.paused){
    safePlay(au,
      ()=>{ btn.classList.add('playing'); setPlayLabel(day,'playing');
            PLAYED[day]=true;                 // 分步条的「①听」可以打勾了
            const s=document.querySelector('#recui_'+day); if(s) refreshSteps(day); },
      ()=>{ playEnded(day); toast("播放失败，请再点一次 · Tap again"); });
  } else { au.pause(); au.currentTime=0; playEnded(day); }
}
function playEnded(day){
  const btn=document.getElementById('pb_'+day);
  if(btn) btn.classList.remove('playing');
  setPlayLabel(day,'again');
}
/* 只重画这一天的分步条 —— 不能整页 renderTask()，
   那会把学生录好还没交的录音、打了一半的字全冲掉 */
function refreshSteps(day){
  const group=document.getElementById('recui_'+day);
  if(!group) return;
  const flow=group.closest('.flow'); if(!flow) return;
  const old=flow.querySelector('.steps'); if(!old) return;
  const t=taskMap()[day]; if(!t) return;
  const hasAudio=!!document.getElementById('au_'+day);
  const tmp=document.createElement('div');
  tmp.innerHTML=stepsHTML(day,hasAudio,false);
  old.replaceWith(tmp.firstChild);
}

/* ========== 学生直接录音 ========== */
const REC={};   // day -> {mr, stream, chunks, timer, t0, blob, url, on}
function canRecord(){
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
}
function pickMime(){
  const list=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'];
  for(const m of list){ try{ if(MediaRecorder.isTypeSupported(m)) return m; }catch(e){} }
  return "";
}
function extOf(type){
  const t=String(type||"");
  if(/mp4|m4a|aac/.test(t)) return "m4a";
  if(/ogg/.test(t)) return "ogg";
  if(/wav/.test(t)) return "wav";
  return "webm";
}
function fmtSec(ms){ const s=Math.floor(ms/1000); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }

/* 提交按钮：有东西可交才变成实心陶土色 */
function refreshSubmitBtn(day){
  const b=document.getElementById('btn_'+day); if(!b) return;
  const ready = !!(REC[day] && REC[day].blob) || !!fileStore[day];
  if(ready){

}

const LIVEBARS=[0,.1,.2,.3,.15,.05,.25,.35,.1,.2,.3,0]
  .map(d=>'<i style="animation-delay:'+d+'s"></i>').join('');

async function startRec(day){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const mime=pickMime();
    const mr= mime? new MediaRecorder(stream,{mimeType:mime}) : new MediaRecorder(stream);
    const chunks=[];
    let live=false, onLive=null;
    mr.ondataavailable=e=>{
      if(e.data && e.data.size){
        chunks.push(e.data);
        if(!live){ live=true; if(onLive) onLive(); }   // 确认「声音真的进来了」
      }
    };
    mr.onstop=()=>{
      try{ stream.getTracks().forEach(t=>t.stop()); }catch(e){}
      const st=REC[day];
      // 学生中途改成「选文件上传」了 → 这段录音是被主动放弃的，别再把它复活成 blob
      if(!st || st.abandoned){ return; }
      clearInterval(st.timer);
      const type=mr.mimeType||mime||"audio/webm";
      const blob=new Blob(chunks,{type});
      if(blob.size<1200){                  // 基本等于没录到：告诉学生，别默默传个空的
        st.on=false; delete REC[day]; renderRecUI(day);
        toast("好像没录到声音，请再试一次 · No sound, please try again");
        return;
      }
      if(st.url) URL.revokeObjectURL(st.url);
      st.blob=blob; st.url=URL.createObjectURL(blob); st.on=false;
      REC[day]=st;
      delete fileStore[day];           // 录音优先于选的文件
      const fn=document.getElementById('fname_'+day); if(fn) fn.textContent="";
      renderRecUI(day);
      toast("录好了！点「提交打卡」就交上去 · Recorded — now tap Submit");
    };
    if(REC[day] && REC[day].url) URL.revokeObjectURL(REC[day].url);
    REC[day]={mr,stream,on:true,warm:true,t0:0,timer:null,blob:null,url:null};
    renderRecUI(day);                       // 先显示「准备中…先别说话」

    // 立刻开始录 —— 就算学生早开口也不会丢。
    mr.start(250);
    // 但要等到「真的有声音数据进来」才叫学生说话。
    // 固定等一个时间不靠谱：第一次用麦克风时，电脑要初始化设备，会慢很多。
    await new Promise(res=>{
      if(live) return res();
      onLive=res;
      setTimeout(res,3000);                 // 兜底：最多等 3 秒
    });
    const st=REC[day];
    if(!st || !st.on){                      // 等待期间被取消了
      try{ mr.state!=='inactive' && mr.stop(); }catch(e){}
      try{ stream.getTracks().forEach(t=>t.stop()); }catch(e){}
      return;
    }
    st.warm=false; st.t0=Date.now();
    st.timer=setInterval(()=>{
      const s=REC[day]; if(!s) return;
      const el=document.getElementById('rt_'+day);
      if(el) el.textContent=fmtSec(Date.now()-s.t0);
      if(Date.now()-s.t0>5*60*1000) stopRec(day);   // 最长 5 分钟，防止忘记停
    },250);
    renderRecUI(day);                       // 变成「请说！录音中」
  }catch(e){
    delete REC[day]; renderRecUI(day);
    toast("不能录音：请允许使用麦克风 Allow microphone");
  }
}
function stopRec(day){
  const st=REC[day];
  if(!st || !st.on) return;
  if(st.warm){                              // 还在热身就取消：直接丢掉
    st.on=false;
    try{ st.stream && st.stream.getTracks().forEach(t=>t.stop()); }catch(e){}
    delete REC[day]; renderRecUI(day); return;
  }
  try{
    if(st.mr.state==='recording'){ st.mr.requestData(); }   // 先把最后一段吐出来
    st.mr.stop();
  }catch(e){ st.on=false; renderRecUI(day); }
}
function myEnded(day){

function playMine(day){

/* 上传型提交 */
const fileStore={};
/* 彻底放弃这一天的录音：关掉麦克风、停掉计时器、清干净。
   ⚠️ 以前这里只写 delete REC[day] —— 正在录的时候麦克风【不会关】，会一直开着录。
   必须先打 abandoned 标记再 stop()，否则 mr.onstop 会把录音复活成 blob。 */
function abandonRec(day){
  const st=REC[day]; if(!st) return;
  st.abandoned=true;
  try{ if(st.mr && st.mr.state!=='inactive') st.mr.stop(); }catch(e){}
  try{ if(st.stream) st.stream.getTracks().forEach(t=>t.stop()); }catch(e){}
  clearInterval(st.timer);
  if(st.url) URL.revokeObjectURL(st.url);
  delete REC[day];
}

function pickFile(day){
  const input=document.getElementById('file_'+day);
  const f=input.files[0];
  if(!f)return;
  // 一天只能交一样东西。已经有录音还去选文件 → 录音会没。
  if(!askReplaceRec(day)){ input.value=""; return; }   // 清空才能再选同一个文件
  abandonRec(day);
  clearShot(day);
  document.getElementById('fname_'+day).textContent="已选：Selected · "+f.name;
  fileStore[day]=f;   // 直接存 File 对象，提交时上传到 Storage
  showUpErr(day,'');  // 换了文件，上一次的失败信息就没意义了
  renderRecUI(day);
}

/* 已经有录音了还要换别的 → 先问一声。
   ⚠️ 以前是【不问一声就删】，学生录了两分钟手滑点一下就全没了，也不能撤销。
   返回 true = 学生同意换掉（或本来就没录音）。 */
function askReplaceRec(day){
  const st=REC[day];
  if(!(st && (st.blob || st.on || st.warm))) return true;
  return confirm(
    "你已经在录音了。换成别的的话，录音会被丢掉，而且拿不回来。\n\n"+
    "You already have a recording. Switching will discard it — permanently.\n\n"+
    "要换吗？ Switch anyway?");
}

/* ===== 页面内相机 =====
   ⚠️ 为什么不用 <input capture> 叫手机自己的相机 App：
   安卓叫出相机 App 时 Chrome 会退到后台，内存一紧张就被系统杀掉，照片带不回来。
   2026-08-09 实测 Ming Hong 和 Ming Xuan 两台手机都这样（从相册选就正常）。
   在页面里开相机就【不会离开 Chrome】，从根上绕开这件事。别改回 capture。 */
const CAM={};
const SHOT_MAX=1600;      // 长边最多 1600px。相机原图 3–12MB，压完约 200–400KB，手机流量传得动
const SHOT_QUALITY=0.85;

function canPhoto(){ return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia); }

/* 相机开着的时候页面重画会把 <video> 冲掉，但摄像头【不会自己关】 —— 必须先收干净 */
function closeAllCams(){ Object.keys(CAM).forEach(closeCam); }

function closeCam(day){
  const c=CAM[day]; if(!c) return;
  try{ if(c.stream) c.stream.getTracks().forEach(t=>t.stop()); }catch(e){}
  delete CAM[day];
  const box=document.getElementById('cam_'+day);
  if(box){ box.innerHTML=''; box.className='camwrap'; }
}

function clearShot(day){
  const s=document.getElementById('shot_'+day);
  if(s){ s.innerHTML=''; s.className='shot'; }
}

function camFail(day, zh, en){
  const box=document.getElementById('cam_'+day); if(!box) return;
  box.innerHTML='<div class="camhint">'+esc(zh)+'<span class="eng">'+esc(en)+'</span>'+
    '<br>可以改用下面的「选文件上传」。<span class="eng">You can use "choose a file" below instead.</span></div>';
  box.className='camwrap show';
}

async function startCam(day){
  if(!canPhoto()){ camFail(day,'这个浏览器不能直接拍照。',"This browser can't take photos."); return; }
  if(!askReplaceRec(day)) return;
  abandonRec(day); clearShot(day); delete fileStore[day];
  const fn=document.getElementById('fname_'+day); if(fn) fn.textContent='';
  showUpErr(day,'');
  closeAllCams();                       // 一次只开一个相机

  const box=document.getElementById('cam_'+day); if(!box) return;
  box.innerHTML='<div class="camhint">正在开相机…<span class="eng">Opening camera…</span></div>';
  box.className='camwrap show';
  try{
    // facingMode 用 ideal 不用 exact —— exact 在只有前镜头的机器上会直接失败
    const stream=await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ideal:'environment'}, width:{ideal:1600}, height:{ideal:1600} }, audio:false });
    CAM[day]={stream};
    box.innerHTML=
      '<div class="camstage"><video id="camv_'+day+'" autoplay playsinline muted></video></div>'+
      '<div class="camrow">'+
        '<button class="btn" onclick="shootPhoto(\''+day+'\')">拍<span class="eng">Take the photo</span></button>'+
        '<button class="btn ghost" onclick="closeCam(\''+day+'\')">取消<span class="eng">Cancel</span></button>'+
      '</div>'+
      '<div class="camhint">对准要拍的东西，再按「拍」。<span class="eng">Point at it, then tap Take.</span></div>';
    const v=document.getElementById('camv_'+day);
    v.srcObject=stream; v.muted=true; v.playsInline=true;
    try{ await v.play(); }catch(e){}
  }catch(err){
    const n=(err&&err.name)||'';
    if(n==='NotAllowedError')      camFail(day,'你还没允许使用相机。请在浏览器里允许，再点一次「拍照」。',"Camera permission was denied. Allow it, then tap 拍照 again.");
    else if(n==='NotFoundError')   camFail(day,'找不到相机。',"No camera found.");
    else                           camFail(day,'相机打不开：'+(err&&err.message||n||'原因不明'),"Could not open the camera.");
  }
}

function shootPhoto(day){
  const c=CAM[day], v=document.getElementById('camv_'+day);
  if(!c || !v || !v.videoWidth){ toast('相机还没准备好，等一下再按 · Camera not ready yet'); return; }
  // 按长边缩到 SHOT_MAX，别把 12MP 原图直接传上去
  const scale=Math.min(1, SHOT_MAX/Math.max(v.videoWidth, v.videoHeight));
  const cv=document.createElement('canvas');
  cv.width =Math.round(v.videoWidth *scale);
  cv.height=Math.round(v.videoHeight*scale);
  cv.getContext('2d').drawImage(v,0,0,cv.width,cv.height);
  cv.toBlob(blob=>{
    if(!blob){ toast('照片没拍成，请再试一次 · Could not save the photo'); return; }
    const file=new File([blob],'photo_'+Date.now()+'.jpg',{type:'image/jpeg'});
    fileStore[day]=file;                 // 走跟「选文件」完全一样的上传路径
    closeCam(day);
    const s=document.getElementById('shot_'+day);
    if(s){
      s.innerHTML='<img alt="" src="'+URL.createObjectURL(blob)+'">'+
        '<div class="camrow"><button class="btn ghost" onclick="startCam(\''+day+'\')">重拍<span class="eng">Retake</span></button></div>'+
        '<div class="camhint">拍好了，点下面「提交打卡」就交上去。'+
          '<span class="eng">Got it — now tap Submit below.</span></div>';
      s.className='shot show';
    }
    const fn=document.getElementById('fname_'+day);
    if(fn) fn.textContent='已拍好：Photo taken · '+(blob.size/1048576).toFixed(2)+'MB';
    refreshSubmitBtn(day);
  },'image/jpeg',SHOT_QUALITY);
}
/* 上传失败的详细原因，写在页面上（不是弹一下就没）。
   学生截图给老师，老师就能知道到底卡在哪一步、文件多大。
   ⚠️ 别改回「只弹一个上传失败」—— 那样等于盲测，出事查不到原因。 */
function showUpErr(day, stage, err, f){
  const box=document.getElementById('uperr_'+day); if(!box) return;
  if(!stage){ box.className='uperr'; box.innerHTML=''; return; }
  const size = f ? (f.size/1048576).toFixed(2)+'MB' : '?';
  const why  = (err && (err.message||String(err))) || '没有错误信息 no message';
  box.innerHTML =
    '交不上去，卡在「'+stage+'」这一步。'+
    '<br><span class="eng">Failed at: '+stage+'</span>'+
    '<br>请把这一块截图给蔡老师。<span class="eng">Please screenshot this for your teacher.</span>'+
    '<div class="why">'+esc(size+' · '+((f&&f.type)||'类型未知')+'\n'+why).slice(0,400)+'</div>';
  box.className='uperr show';
}

function submitUpload(day){
  const st=REC[day];
  const rec = (st && st.blob) ? st.blob : null;      // 录音优先
  const f = rec || fileStore[day];
  if(!f){ toast("请先录音，或选一个文件 Record or choose a file"); return; }
  const t=taskMap()[day];
  const btn=document.getElementById('btn_'+day);
  btn.disabled=true; btn.classList.remove('ghost');
  btn.innerHTML='上传中…<span class="eng">Uploading</span>';
  showUpErr(day,'');                       // 重试时先把上一次的错误清掉
  let stage='传文件到服务器';               // 记住失败在哪一步：传文件？还是记打卡？
  // 先上传文件到 Storage，拿到网址，再写一条打卡记录
  uploadFile(f, rec ? extOf(rec.type) : null)
    .then(url=>{ stage='记录打卡';
      return rpc("submit_checkin",{p_username:currentUsername,p_day:day,p_task_title:cleanText(t.title),p_type:"upload",p_text_answer:"",p_file_url:url}); })
    .then(res=>{ if(!res||!res.ok) throw new Error("submit_checkin 没有回 ok"); markDone(day); })
    .catch(err=>{ btn.disabled=false; refreshSubmitBtn(day);
      showUpErr(day, stage, err, f);
      toast("上传失败，请重试 · Upload failed, please retry"); });
}

function markDone(day){
  const local=getLocalDone(); local[day]=true; setLocalDone(local);
  const redo=getRedo(); delete redo[day]; setRedo(redo);   // 交了就不再是「重做中」
  if(!SERVER_DONE[day]) SERVER_DONE[day]={status:'pending',comment:''};
  renderTask();
  celebrate(Object.keys(getDone()).length);
  refreshFromServer();                                     // 顺便同步一次
}
function undoTask(day){
  const redo=getRedo(); redo[day]=true; setRedo(redo);     // 标记「想再做一次」
  const local=getLocalDone(); delete local[day]; setLocalDone(local);
  renderTask();

}

/* 从服务器重新拉一次（拿老师最新的评语 / 别的设备交的作业） */
let refreshing=false;
function refreshFromServer(){
  if(refreshing || !currentUsername) return;
  refreshing=true;
  rpc("student_login",{p_username:currentUsername})
    .then(res=>{
      if(res && res.ok){
        SERVER_DONE=res.done||{};
        TASKS=sortTasks(res.tasks||[]);
        renderTask();
      }
    })
    .catch(()=>{})
    .finally(()=>{ refreshing=false; });
}
/* 回到这个页面时自动刷新一次——老师刚批改完，学生切回来就能看到评语。
   但正在录音 / 打了一半字的时候不能刷，会把没交的东西冲掉。 */
function busyNow(){
  if(Object.keys(REC).length) return true;                    // 在录 或 录好还没交
  if(Object.keys(fileStore).length) return true;              // 选了文件／拍了照还没交
  if(Object.keys(CAM).length) return true;                    // 相机正开着，别把画面刷掉
  const a=document.querySelector('textarea.answer');
  if(a && a.value.trim()) return true;                        // 打了字还没交
  return false;
}
function maybeRefresh(){ if(!busyNow()) refreshFromServer(); }
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) maybeRefresh(); });
window.addEventListener('focus',maybeRefresh);

function cleanText(s){ return String(s||"").replace(/<[^>]+>/g,''); }

/* 庆祝 —— 学生最有成就感的一刻 */
function celebrate(streak){
  const c=CHEERS[Math.floor(Math.random()*CHEERS.length)];
  document.getElementById('celSeal').textContent=c.seal;
  document.getElementById('celZh').textContent="恭喜你打卡成功！";
  document.getElementById('celEn').textContent=c.en;

  document.getElementById('celStreak').innerHTML=
    icon('i-flame')+'这周做了 '+streak+' 天<span class="eng-i">'+streak+' days done this week</span>';
  document.getElementById('celebrate').classList.add('show');
  shootConfetti();
}
function closeCelebrate(){ document.getElementById('celebrate').classList.remove('show'); }
function shootConfetti(){
  // 彩屑用水彩四色，不用旧国潮的柿子红／晴山蓝／竹青
  const colors=["#f0d5c4","#d6e0cd","#cfdde6","#efe0c4","#a8683f"];
  for(let i=0;i<48;i++){
    const c=document.createElement('div');
    c.className="confetti";
    c.style.left=Math.random()*100+"vw";
    c.style.background=colors[Math.floor(Math.random()*colors.length)];
    if(i%3===0){ c.style.width="9px"; c.style.height="9px"; c.style.borderRadius="50%"; }
    c.style.transform="rotate("+Math.random()*360+"deg)";
    const dur=2+Math.random()*1.5;
    c.style.transition="top "+dur+"s ease-in, transform "+dur+"s linear, opacity "+dur+"s";
    document.body.appendChild(c);
    requestAnimationFrame(()=>{ c.style.top=(100+Math.random()*20)+"vh"; c.style.transform="rotate("+(720+Math.random()*360)+"deg)"; c.style.opacity="0"; });
    setTimeout(()=>c.remove(),dur*1000+200);
  }
}

let toastTimer;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2600);
}

boot();
